<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>工作看板</title>
<style>
  html{font-size:calc(16px * var(--z,2))}
  :root{
    --bg:#0a0b0e; --panel:#101217; --card:#161920; --card2:#1c202a;
    --line:#232733; --line2:#303647;
    --ink:#e9ecf2; --mute:#8b93a1; --dim:#646c7b;
    --acc:#3b82f6; --acc2:#2563eb;
    --a:#f0556d; --b:#e0a03a; --c:#4ea3f5;
    --run:#f0556d; --today:#4ea3f5; --tmr:#a78bfa;
    --ok:#34d399; --warn:#fbbf24; --bad:#f0556d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:1.0625rem/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  a{color:var(--acc);text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------- shell ---------------- */
  #app{display:none}
  .shell{display:flex;min-height:100vh}
  .side{width:16.375rem;flex:0 0 16.375rem;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side.hide{display:none}
  .me{display:flex;align-items:center;gap:10px;padding:15px 16px 13px;flex:0 0 auto}
  .av{width:2.0625rem;height:2.0625rem;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:grid;place-items:center;font-weight:700;font-size:0.9688rem;color:#fff;flex:0 0 auto}
  .me b{font-size:1.125rem;font-weight:600}
  .nav{padding:0 8px;flex:0 0 auto}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;margin-bottom:1px;
    border-radius:9px;color:var(--mute);font-size:1.0625rem;text-align:left}
  .nav button:hover{background:var(--card);color:var(--ink)}
  .nav button.on{background:var(--card2);color:var(--ink);font-weight:600}
  .nav i{font-style:normal;width:17px;text-align:center;font-size:1.0625rem;flex:0 0 auto;opacity:.85}
  .nav button.on i{opacity:1}
  .side .nav{flex:1;min-height:0;overflow-y:auto}
  .fold{flex:0 0 auto;padding:10px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:0.9062rem;
    display:flex;align-items:center;gap:7px}
  .fold:hover{color:var(--ink)}

  /* ---------------- header ---------------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:16px 24px 0}
  .top h1{margin:0;font-size:1.875rem;font-weight:700;letter-spacing:-.015em;
    display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .top h1 i{font-style:normal;font-size:1.6562rem;flex:0 0 auto}
  .top h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .icon{width:2.375rem;height:2.375rem;border-radius:9px;color:var(--mute);display:grid;place-items:center;
    font-size:1.125rem;position:relative}
  .icon:hover{background:var(--card);color:var(--ink)}
  #busy{color:var(--acc);animation:spin 1s linear infinite;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .icon b{position:absolute;top:2px;right:2px;min-width:1.125rem;height:1.125rem;border-radius:9px;background:var(--bad);
    color:#fff;font-size:0.75rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
  .srch{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:0 10px;height:2.375rem}
  .srch input{background:none;border:0;outline:0;width:9.375rem;font-size:0.9688rem}
  .srch input::placeholder{color:var(--dim)}
  .srch.off{display:none}
  .ava{width:2.375rem;height:2.375rem;border-radius:50%;background:linear-gradient(135deg,#f0556d,#a78bfa);
    display:grid;place-items:center;font-weight:700;font-size:0.9688rem;color:#fff;flex:0 0 auto}

  .sub{display:flex;align-items:center;gap:9px;padding:9px 24px 0;color:var(--mute);font-size:1rem;flex-wrap:wrap}
  .sub .d{display:flex;align-items:center;gap:7px}
  /* 帶文字之後不能再是固定的小方塊，不然「上一週」會被擠成直排 */
  .step{min-width:1.875rem;height:1.875rem;padding:0 8px;border-radius:7px;color:var(--dim);
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:0.9688rem}
  .step b{font-weight:600;font-size:0.875rem}
  /* 螢幕窄的時候收回只剩箭頭，tooltip 還在 */
  @media(max-width:820px){.step b{display:none}.step{padding:0}}
  .step:hover{background:var(--card);color:var(--ink)}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:0.9375rem;color:var(--mute)}
  .chip:hover{color:var(--ink);border-color:var(--line2)}
  .chip.on{background:rgba(59,130,246,.14);border-color:var(--acc);color:#8fc4ff}
  .grow{flex:1}
  .btn{background:var(--acc2);border-radius:9px;padding:9px 15px;font-size:1.0625rem;font-weight:600;color:#fff;
    display:flex;align-items:center;gap:7px}
  .btn:hover{background:var(--acc)}
  .split{display:flex;align-items:stretch;position:relative}
  .split .btn{border-radius:9px 0 0 9px}
  .split .car{background:var(--acc2);border-radius:0 9px 9px 0;color:#fff;padding:0 9px;font-size:0.8125rem;
    border-left:1px solid rgba(255,255,255,.22)}
  .split .car:hover{background:var(--acc)}
  .menu{position:absolute;right:0;top:calc(100% + 5px);background:var(--panel);border:1px solid var(--line2);
    border-radius:10px;padding:5px;min-width:168px;z-index:12;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .menu.on{display:block}
  .menu button{display:block;width:100%;text-align:left;padding:8px 11px;border-radius:7px;font-size:1rem;color:var(--mute)}
  .menu button:hover{background:var(--card2);color:var(--ink)}

  /* ---------------- columns ---------------- */
  /* 生意數字：Shopline 營業額、FB 廣告花費，還有兩者換算出來的比率 */
  .mx{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin:12px 24px 0}
  .mx .m{flex:1 1 150px;min-width:0;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:9px 12px}
  .mx .m u{display:block;text-decoration:none;color:var(--dim);font-size:0.8125rem;margin-bottom:3px}
  .mx .m b{display:block;font-size:1.375rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .mx .m s{display:block;text-decoration:none;color:var(--mute);font-size:0.8125rem;margin-top:2px}
  .mx .m.good b{color:#4ade9e}
  .mx .m.bad b{color:#ff8b8b}
  .mx .m.na b{color:var(--dim);font-weight:600}
  .mx .up{flex:0 0 auto;align-self:center;color:var(--dim);font-size:0.8125rem;padding:0 2px}
  .mx .miss{flex:1 1 100%;color:var(--mute);font-size:0.875rem;padding:9px 12px;
    background:var(--card);border:1px dashed var(--line2);border-radius:11px}
  @media(max-width:980px){.mx{margin:10px 14px 0;gap:8px}.mx .m{flex:1 1 42%}}
  .brief{margin:12px 24px 0;padding:10px 13px 11px;
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:11px;font-size:0.875rem;color:var(--mute);line-height:1.6}
  .brief .bh{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .brief .bh b{font-size:0.9375rem;color:var(--ink)}
  .brief i{font-style:normal;flex:0 0 auto}
  .brief .x{margin-left:auto;flex:0 0 auto;background:none;border:0;color:var(--dim);
    font-size:1.0625rem;line-height:1;padding:0 2px;cursor:pointer}
  .brief .x:hover{color:var(--ink)}
  .brief .bs{display:flex;gap:10px;align-items:baseline;padding:2px 0}
  .brief .bs+.bs{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
  .brief .bs>u{flex:0 0 4.5rem;text-decoration:none;color:var(--dim);font-weight:600;font-size:0.8125rem}
  .brief .bs>div{min-width:0;flex:1 1 auto}
  .brief ol{margin:0;padding-left:1.35rem}
  .brief li{margin:1px 0}
  .brief li::marker{color:var(--dim)}
  .brief .todo li{color:var(--ink)}
  .brief p{margin:0}
  @media(max-width:980px){.brief{margin:10px 14px 0}
    .brief .bs{display:block}.brief .bs>u{display:block;margin-bottom:1px}}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 24px 8px;align-items:start}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px;min-width:0}
  .col>h3{display:flex;align-items:center;gap:8px;margin:0 4px 12px;font-size:1.125rem;font-weight:700}
  .col>h3 i{font-style:normal;font-size:1.125rem}
  .col>h3 b{margin-left:auto;font-size:0.9688rem;color:var(--dim);font-weight:600}
  .c-run h3{color:var(--run)} .c-today h3{color:var(--today)} .c-tmr h3{color:var(--tmr)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .c-run h3 i{animation:pulse 2.4s infinite}

  .t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;
    transition:border-color .12s,background .12s}
  .t:hover{border-color:var(--line2);background:var(--card2)}
  .t.live{background:linear-gradient(180deg,rgba(240,85,109,.08),transparent 60%);border-color:rgba(240,85,109,.28)}
  /* 優先級改用左側色帶，不佔一整排標籤 */
  .t.pA{border-left:3px solid var(--a)}
  .t.pB{border-left:3px solid var(--b)}
  .t.pC{border-left:3px solid var(--c)}
  .t .ti{font-size:1.125rem;font-weight:600;line-height:1.4;word-break:break-word}
  .own{font-style:normal;margin-right:5px;font-size:0.9375rem;vertical-align:1px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:0.875rem;font-weight:600;padding:2.5px 8px;border-radius:6px;white-space:nowrap}
  .tag.A{background:rgba(240,85,109,.15);color:#ff8095}
  .tag.B{background:rgba(224,160,58,.15);color:#e8b45c}
  .tag.C{background:rgba(78,163,245,.15);color:#7bbcff}
  .tag.src{background:rgba(52,211,153,.14);color:#4ade9e}
  .tag.pj{background:var(--card2);color:var(--mute);border:1px solid var(--line2)}
  .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:9px}
  .nx{font-size:0.9375rem;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nx b{color:var(--dim);font-weight:500}
  .nx em{font-style:normal;color:var(--dim);margin-right:7px}
  .nx em::after{content:" ·";opacity:.6}
  .dd{font-size:0.9375rem;color:var(--dim);white-space:nowrap;flex:0 0 auto;display:flex;align-items:center;gap:4px}
  .dd.over{color:var(--bad);font-weight:600} .dd.now{color:var(--warn);font-weight:600}
  /* 拖曳換欄：手指直向留給捲動，橫向與長按才由我們接手 */
  .t[data-id]{cursor:grab;touch-action:pan-y}
  .t.lift{opacity:.28}
  .ghost{position:fixed;z-index:40;pointer-events:none;margin:0;cursor:grabbing;
    transform:rotate(-1.5deg);box-shadow:0 14px 34px rgba(0,0,0,.6);border-color:var(--acc)}
  .col.drop{background:rgba(59,130,246,.08);border-color:var(--acc)}
  .chip2[data-id]{cursor:grab;touch-action:pan-y}
  .mc.drop{background:rgba(59,130,246,.14);outline:2px dashed var(--acc);outline-offset:-2px}
  .chip2.ghost{position:fixed;z-index:40;pointer-events:none;margin:0;cursor:grabbing;
    box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:.95}
  .col.drop>h3 b{color:var(--acc)}
  .col.drop .add{border-color:var(--acc);color:var(--acc)}
  body.dragging{user-select:none;-webkit-user-select:none}
  .acts{display:none;gap:6px;margin-top:9px;flex-wrap:wrap}
  .t:hover .acts{display:flex}
  .acts button{background:var(--card2);border:1px solid var(--line2);border-radius:7px;
    padding:4px 9px;font-size:0.9062rem;color:var(--mute)}
  .acts button:hover{color:var(--ink);border-color:var(--dim)}
  .acts button:active,.chip:active,.add:active{transform:scale(.96)}
  .t.busy{opacity:.5;pointer-events:none}
  .acts button.go{color:#8fc4ff;border-color:rgba(78,163,245,.32)}
  .acts button.ok{color:#4ade9e;border-color:rgba(52,211,153,.32)}
  .add{width:100%;border:1px dashed var(--line2);border-radius:10px;padding:9px;color:var(--dim);font-size:0.9688rem;margin-top:2px}
  .add:hover{color:var(--acc);border-color:var(--acc)}
  .none{color:var(--dim);font-size:0.9375rem;padding:12px 4px 16px;text-align:center}

  /* ---------------- stats ---------------- */
  .stats{display:grid;grid-template-columns:1.7fr repeat(4,1fr);gap:14px;
    margin:8px 24px 24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 18px}
  .st{min-width:0;position:relative}
  .st .k{font-size:0.9062rem;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .st .v{font-size:1.875rem;font-weight:700;letter-spacing:-.025em;line-height:1.1;display:flex;align-items:baseline;gap:6px}
  .st .v small{font-size:1rem;color:var(--dim);font-weight:600}
  .st .v em{font-style:normal;font-size:0.9062rem;font-weight:600;color:var(--ok)}
  .st .v em.dn{color:var(--bad)}
  .st .u{font-size:0.9062rem;color:var(--mute);margin-top:3px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bar{height:4px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--b),var(--a))}
  .ring{position:absolute;right:0;top:14px;width:3.25rem;height:3.25rem}

  /* ---------------- generic views ---------------- */
  .wrap{padding:16px 24px 40px}
  .sec{font-size:0.9375rem;color:var(--dim);font-weight:600;margin:18px 2px 9px}
  .sec:first-child{margin-top:2px}
  /* 昨天的紀錄一天可能十幾筆，全部攤開要捲很久，所以預設只留標題 */
  /* 昨天執行的內容：Cowork 一欄、Claude Code 一欄 */
  .srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:12px;align-items:start}
  .srcc{min-width:0}
  .srcc>h4{display:flex;align-items:center;gap:7px;margin:0 2px 7px;font-size:0.9375rem;font-weight:700}
  .srcc>h4 b{margin-left:auto;font-size:0.875rem;color:var(--dim);font-weight:600}
  .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .dot.cc{background:#34d399}.dot.cw2{background:#e0a03a}.dot.mn{background:#4ea3f5}
  .panelbox h3 .cnt{margin-left:4px;font-size:0.9375rem;color:var(--dim);font-weight:600}
  .lg{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .lgh{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;
    background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
  .lgh:hover{background:var(--card2)}
  .lgh .cv{flex:0 0 auto;font-style:normal;color:var(--dim);font-size:0.8125rem;
    transition:transform .12s;transform-origin:50% 50%}
  .lg.open .lgh .cv{transform:rotate(90deg)}
  .lgh .ti{flex:1 1 auto;min-width:0;font-size:1.0625rem;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lgh em{flex:0 0 auto;font-style:normal;color:var(--dim);font-size:0.8125rem}
  .lgb{padding:0 12px 11px}
  .lgb .tags{margin-top:0}
  .lg .sm{font-size:0.9375rem;color:var(--mute);margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .panelbox h3{margin:0 0 12px;font-size:1.125rem}

  /* ---------------- 日曆（參考 Google 日曆） ---------------- */
  .cw{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .crow{display:grid;grid-template-columns:var(--gut) repeat(var(--n),minmax(0,1fr))}
  .chead{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:4}
  .chead>div{padding:7px 4px 8px;text-align:center;border-left:1px solid var(--line)}
  .chead>div:first-child{border-left:0;font-size:0.7812rem;color:var(--dim);display:flex;
    align-items:flex-end;justify-content:center;padding-bottom:10px}
  .chead .wd{font-size:0.875rem;color:var(--dim)}
  .chead .dn{font-size:1.4375rem;font-weight:600;line-height:1.5;margin-top:1px}
  .chead .today .wd{color:var(--acc)}
  .chead .today .dn{background:var(--acc2);color:#fff;border-radius:50%;
    width:2.125rem;height:2.125rem;line-height:2.125rem;margin:1px auto 0;font-weight:700;font-size:1.125rem}
  .chip2{display:block;width:100%;text-align:left;font-size:0.8125rem;line-height:1.35;padding:2.5px 6px;
    border-radius:4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    border-left:3px solid}
  .chip2.A{background:rgba(240,85,109,.16);border-color:var(--a);color:#ff97a9}
  .chip2.B{background:rgba(224,160,58,.16);border-color:var(--b);color:#e8b45c}
  .chip2.C{background:rgba(78,163,245,.16);border-color:var(--c);color:#8cc4ff}
  .chip2.dn2{opacity:.4;text-decoration:line-through}
  .cbody{max-height:min(62vh,660px);overflow-y:auto;position:relative}
  .cbody .crow{position:relative}
  .gut{border-right:0}
  .gut div{height:var(--h);font-size:0.7812rem;color:var(--dim);text-align:right;
    padding-right:6px;transform:translateY(-7px)}
  .dcol{border-left:1px solid var(--line);position:relative}
  .dcol.wknd{background:rgba(255,255,255,.015)}
  .dcol.tdy{background:rgba(59,130,246,.05)}
  .hr{height:var(--h);border-bottom:1px solid var(--line)}
  .ev{position:absolute;border-radius:5px;padding:2px 5px;font-size:0.7812rem;line-height:1.3;cursor:pointer;
    overflow:hidden;border-left:3px solid;z-index:2}
  .ev b{display:block;font-weight:600;font-size:0.8125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev s{display:block;text-decoration:none;opacity:.75;font-size:0.75rem}
  .ev.cc{background:rgba(52,211,153,.17);border-color:#34d399;color:#7ee7b4}
  .ev.cw2{background:rgba(224,160,58,.17);border-color:var(--b);color:#eec27a}
  .ev.mn{background:rgba(78,163,245,.17);border-color:var(--c);color:#9ccdff}
  .ev.run{border-style:dashed}
  .nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:5;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;
    border-radius:50%;background:var(--bad)}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line)}
  .mgrid>.mh{background:var(--panel);text-align:center;font-size:0.875rem;color:var(--dim);padding:7px 0}
  .mc{background:var(--panel);min-height:7rem;padding:5px 5px 6px}
  .mc.out{background:rgba(0,0,0,.22)}
  .mc.tdy{background:rgba(59,130,246,.06)}
  .mc .d{font-size:0.9062rem;color:var(--dim);font-weight:600;margin-bottom:3px;text-align:right}
  .mc.tdy .d{color:#fff;background:var(--acc2);border-radius:50%;width:1.5rem;height:1.5rem;
    line-height:1.5rem;text-align:center;margin:0 0 3px auto;font-size:0.875rem}
  .mc .more{font-size:0.7812rem;color:var(--dim);padding-left:2px}
  /* 修飾詞別再叫 wk——那個名字被統計列的週長條圖佔走了（.wk{display:flex}），

<script>

  {v:'notes',    i:'▤', n:'資料區',    t:'資料區',        ic:'🗂️'},
  {v:'done',     i:'✓', n:'完成項目',  t:'完成項目',      ic:'✅'},
  {v:'settings', i:'⚙', n:'設定',      t:'設定',          ic:'⚙'}
];

var TOKEN='',VIEW='board',KIND='task',OWNER='我',EDIT=null,EDITL=null,COL='',DATE=null,PJDATE=null,PJRANGE='week',OVDATE=null,OVRANGE='week',SRC='',ALL=0,D=null,RAW=null;
try{TOKEN=localStorage.getItem('worklog_token')||''}catch(e){}

var $=function(i){return document.getElementById(i)};

/** 字級縮放。所有字級都是 rem，改 html 的 font-size 就整份跟著縮放。
    存在這台裝置，手機和桌機可以各自設不同大小。 */
var STATS=0,Z=2,DRANGE='week',VC={};
var BOPEN=localStorage.getItem('briefOpen')!=='0';
var MXOPEN=localStorage.getItem('mxOpen')!=='0';
var LOPEN={};      // 昨天的紀錄哪幾筆是展開的，key 是紀錄 id
try{Z=parseFloat(localStorage.getItem('worklog_zoom'))||2;
    STATS=localStorage.getItem('worklog_stats')==='1'?1:0}catch(e){}
function toggleStats(){
  STATS=STATS?0:1;
  try{localStorage.setItem('worklog_stats',STATS)}catch(e){}
  $('menu').classList.remove('on');paint()}
function applyZ(){
  Z=Math.min(2.6,Math.max(1,Math.round(Z*10)/10));
  document.documentElement.style.setProperty('--z',Z);
  try{localStorage.setItem('worklog_zoom',Z)}catch(e){}}
function zoom(d){Z+=d*0.1;applyZ();toast('字級 '+Math.round(Z*100)+'%');
  if(VIEW==='projects')paint()}     // 日曆的時間軸高度跟著字級走，要重畫
applyZ();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},1900)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
/** a 到 b 差幾天（日期字串，只算日）。注意別叫 days——那個名字給日曆佔走了。 */
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function md(s){var m=String(s).match(/^\d{4}-(\d{2})-(\d{2})/);return m?(+m[1])+'/'+(+m[2]):''}
function parse(s){return new Date(String(s).slice(0,10)+'T00:00:00')}

function call(a,p){return new Promise(function(res,rej){
  google.script.run.withSuccessHandler(function(r){r&&r.ok?res(r):rej(new Error((r&&r.error)||'未知錯誤'))})
    .withFailureHandler(rej).uiCall(TOKEN,a,p||{})})}

function boot(){
  if(!TOKEN){$('gate').style.display='block';return}
  $('gate').style.display='none';$('app').style.display='block';
  $('nav').innerHTML=VIEWS.filter(function(x){return !x.hide}).map(function(x){
    return '<button data-v="'+x.v+'" onclick="go(\''+x.v+'\')"><i>'+x.i+'</i>'+x.n+'</button>'}).join('');
  go('board')}
function saveTok(){var v=$('tok').value.trim();if(!v)return;
  TOKEN=v;$('err').textContent='';
  call('ping').then(function(){try{localStorage.setItem('worklog_token',v)}catch(e){}boot()})

/** 匯入之後補齊 id 等欄位。會改動整張「任務」表，所以要按兩次。 */
function backfill(){
  var b=$('bfBtn');if(!b)return;
  if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='再按一次確認';return}
  b.dataset.armed='';b.disabled=true;b.textContent='補齊中…';busy(1);
  var done=function(){busy(0);b.disabled=false;b.textContent='補齊匯入的任務'};
  call('backfill',{}).then(function(r){
    done();
    toast(r.rows?('掃了 '+r.rows+' 筆：補 id '+r.id+'、建立時間 '+r.created+
      '、優先 '+r.priority+'、狀態 '+r.status+'、日期 '+r.due+
      (r.dueBad?'；'+r.dueBad+' 筆日期看不懂，原文已移到備註':'')):'「任務」工作表是空的');
    VC={};load()})
   .catch(function(e){done();toast(e.message)})}

function logout(){try{localStorage.removeItem('worklog_token')}catch(e){}location.reload()}
function side(on,fold){var s=$('side');
  if(fold){s.classList.toggle('hide');return}
  s.classList.toggle('show',!!on);$('scrim').classList.toggle('on',!!on)}
function openSheet(){window.open(SHEET,'_blank','noopener')}

function go(v){
  VIEW=v;$('menu').classList.remove('on');side(0);
  var m=VIEWS.filter(function(x){return x.v===v})[0]||VIEWS[0];
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.v===v)});

/** 每個頁面（含它的參數）各自一份快取的鍵 */
function vkey(){
  if(VIEW==='board')return 'board:'+(DATE||today());
  if(VIEW==='projects')return 'projects:'+PJRANGE+':'+(PJDATE||today());
  if(VIEW==='overview')return 'overview:'+OVRANGE+':'+(OVDATE||today());
  if(VIEW==='done')return 'done:'+DRANGE;
  if(VIEW==='outputs')return 'outputs:'+SRC+':'+ALL;
  return VIEW}

function fetchView(){
  if(VIEW==='projects')return call('projects',{range:PJRANGE,date:PJDATE||today()});
  // 看板總覽跟時間表要的是同一份資料（區間內的任務），只是畫法不同，共用同一個 action
  if(VIEW==='overview')return call('projects',{range:OVRANGE,date:OVDATE||today()});
  if(VIEW==='pool')return call('pool',{});
  if(VIEW==='outputs')return call('outputs',{source:SRC,all:ALL?'1':''});
  if(VIEW==='done')return call('done',{range:DRANGE});
  if(VIEW==='notes')return call('data',{});
  return call('board',DATE?{date:DATE}:{})}

/** 拿到資料之後要做的事：看板資料留一份給卡片動作用，側欄專案池也跟著更新 */
function settle(r){
  RAW=r;
  if(r.stats)D=r;
  if(r.projects&&(r.stats||r.order))renderPjs(r.projects);
  paint()}

function busy(on){$('busy').style.display=on?'':'none'}

/**
 * 有快取就先畫舊的，再去背景更新——切回看過的頁面是即時的，不會閃一下「載入中」。
 * 沒看過的頁面才顯示載入中。
 */
function load(){
  if(VIEW==='settings'){RAW=null;paint();return}
  var k=vkey(),had=VC[k];
  if(had)settle(had);
  else $('view').innerHTML='<div class="spin">載入中…</div>';
  busy(1);
  fetchView().then(function(r){VC[k]=r;settle(r);busy(0)})
   .catch(function(e){
     busy(0);
     if(!had)$('view').innerHTML='<div class="spin">錯誤：'+esc(e.message)+'</div>';
     else toast(e.message);
     if(/token/.test(e.message))logout()})}

function shift(n){
  if(VIEW==='projects'){
    var d=parse(PJDATE||today());
    if(PJRANGE==='day')d.setDate(d.getDate()+n);
    else if(PJRANGE==='week')d.setDate(d.getDate()+7*n);
    else d.setMonth(d.getMonth()+n);
    PJDATE=ymd(d)}
  else if(VIEW==='overview'){
    var o=parse(OVDATE||today());
    if(OVRANGE==='week')o.setDate(o.getDate()+7*n);else o.setMonth(o.getMonth()+n);
    OVDATE=ymd(o)}
  else if(VIEW==='board'){var b=parse(DATE||today());b.setDate(b.getDate()+n);DATE=ymd(b)}
  else return;
  load()}
function goToday(){DATE=null;PJDATE=null;OVDATE=null;load()}
function pjRange(r){PJRANGE=r;load()}
function ovRange(r){OVRANGE=r;load()}

/* ---------------- header bits ---------------- */
var RNAME={day:'日',week:'週',month:'月'};
function header(){
  var lab='',now=true;
  var span=(VIEW==='projects'||VIEW==='overview')&&RAW&&RAW.from;
  if(span){
    lab=RAW.range==='day'?dayLab(RAW.from):(RAW.from+' – '+RAW.to);
    now=RAW.from<=today()&&today()<=RAW.to}
  else{var d=parse((RAW&&RAW.date)||DATE||today());lab=dayLab(ymd(d));now=ymd(d)===today()}
  $('dateLab').textContent=lab;
  // 光是 ‹ › 看不出會跳多遠，直接寫「上週／下週」「上個月／下個月」
  var unit=VIEW==='projects'?{day:'天',week:'週',month:'個月'}[PJRANGE]
    :VIEW==='overview'?{week:'週',month:'個月'}[OVRANGE]:'天';
  $('prevBtn').querySelector('b').textContent='上一'+unit;
  $('nextBtn').querySelector('b').textContent='下一'+unit;
  $('prevBtn').title='上一'+unit;$('nextBtn').title='下一'+unit;
  $('todayChip').classList.toggle('on',now);
  $('todayChip').textContent=VIEW==='projects'?{day:'今天',week:'本週',month:'本月'}[PJRANGE]
    :VIEW==='overview'?{week:'本週',month:'本月'}[OVRANGE]:'今天';

  var ex='';
  if(VIEW==='projects')ex=['day','week','month'].map(function(r){
    return '<button class="chip'+(PJRANGE===r?' on':'')+'" onclick="pjRange(\''+r+'\')">'+RNAME[r]+'</button>'}).join(' ');
  if(VIEW==='overview')ex=['week','month'].map(function(r){
    return '<button class="chip'+(OVRANGE===r?' on':'')+'" onclick="ovRange(\''+r+'\')">'+RNAME[r]+'</button>'}).join(' ');
  if(VIEW==='outputs'&&RAW)ex=srcChips(RAW);
  if(VIEW==='done')ex=[['week','本週'],['month','本月'],['all','全部']].map(function(r){
    return '<button class="chip'+(DRANGE===r[0]?' on':'')+'" onclick="DRANGE=\''+r[0]+'\';load()">'+
      r[1]+'</button>'}).join(' ');
  // 每日看板的三條橫幅各有一顆開關，並排在日期列——不要有的在這裡、有的藏在 ▾ 選單
  if(VIEW==='board')ex=[
    (RAW&&RAW.note?sw('早晨簡報',BOPEN,'toggleBrief()'):''),
    sw('營運數字',MXOPEN,'toggleMx()'),
    sw('統計列',!!STATS,'toggleStats()')
  ].filter(Boolean).join(' ');
  $('extra').innerHTML=ex;

  var od=RAW&&(RAW.stats?RAW.stats.overdue:RAW.overdue);
  $('bell').style.display=od?'grid':'none';$('bell').textContent=od||0}

/** 日期列上的開關鈕，開著是實心、關著帶個 ▾ */
function sw(name,on,fn){
  return '<button class="chip'+(on?' on':'')+'" onclick="'+fn+'">'+name+' '+(on?'▴':'▾')+'</button>'}

function dayLab(s){var d=parse(s);
  return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日（星期'+'日一二三四五六'[d.getDay()]+'）'}

function hit(o,q){return !q||[o.title,o.project,o.next,o.waiting,o.summary,o.source]
  .some(function(x){return String(x||'').toLowerCase().indexOf(q)>=0})}

function paint(){
  header();
  var q=$('q').value.trim().toLowerCase();
  if(VIEW!=='board'){mx(null);brief('')}   // 這兩條只屬於每日看板
  if(VIEW==='settings')return $('view').innerHTML=settings();
  if(!RAW)return;
  if(VIEW==='board')return $('view').innerHTML=board(RAW,q);
  if(VIEW==='overview')return $('view').innerHTML=overview(RAW,q);
  if(VIEW==='projects')return $('view').innerHTML=projects(RAW,q);
  if(VIEW==='pool')return $('view').innerHTML=pool(RAW,q);
  if(VIEW==='outputs')return $('view').innerHTML=outputs(RAW,q);
  if(VIEW==='done')return $('view').innerHTML=done(RAW,q);
  if(VIEW==='notes')return $('view').innerHTML=notes(RAW,q)}

/* ---------------- board ---------------- */
function board(r,q){
  brief(r.note);mx(r.metrics);
  var f=function(a,c){return a.filter(function(x){return hit(x,q)}).map(function(t){return taskCard(t,c)})};
  var run=f(r.running,'run').concat(r.liveLogs.filter(function(l){return hit(l,q)}).map(logCard));
  return '<div class="cols">'+
    col('c-run','⏰','AI 正執行工作',run,'現在沒有進行中的工作')+
    col('c-today','📅','今日工作',f(r.today,'today'),'今天沒有到期的任務')+
    col('c-tmr','🕐','明日工作',f(r.tomorrow,'tmr').concat(f(r.unscheduled.slice(0,3),'tmr')),'明天空著')+
    '</div>'+(STATS?stats(r):'')}

/** 早晨簡報：統計列收起來之後，它就沒地方擺了，改成日期列下面一行。
    可以按 ✕ 收起來，收起後從標題列那顆「早晨簡報」鈕叫回來，選擇會記住。 */
function brief(note){
  var el=$('brief'),show=note&&BOPEN;
  el.innerHTML=show?'<div class="bh"><i>🎯</i><b>早晨簡報</b>'+
    '<button class="x" onclick="toggleBrief()" title="收起">✕</button></div>'+
    briefBody(note):'';
  el.style.display=show?'':'none'}

/**
 * 簡報是 morning-brief skill 寫的純文字，格式固定成「標籤：內容」四段
 * （昨天／今天必做／進行中／建議）。以前整篇串成一行看不出結構，
 * 這裡拆回分段，有編號的那幾段再拆成條列。
 * 認不出標籤的行就原樣接在上一段後面，不會被吃掉。
 */
function briefBody(note){
  var secs=[];
  String(note).split('\n').forEach(function(line){
    var t=line.trim();if(!t)return;
    var m=t.match(/^([^：:]{1,10})[：:]\s*(.*)$/);
    if(m)secs.push({label:m[1],body:m[2]});
    else if(secs.length)secs[secs.length-1].body+=' '+t;
    else secs.push({label:'',body:t})});
  if(!secs.length)return '';
  return secs.map(function(s){
    var items=briefItems(s.body);
    var body=items
      ? '<ol'+(s.label.indexOf('必做')>=0?' class="todo"':'')+'>'+
        items.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'
      : '<p>'+esc(s.body)+'</p>';
    return '<div class="bs">'+(s.label?'<u>'+esc(s.label)+'</u>':'')+'<div>'+body+'</div></div>'
  }).join('')}

/** 把「1. 甲 2. 乙 3. 丙」拆成陣列；沒有編號就回 null 當一段文字。
    只認一到兩位數後面接句點再接非數字，才不會把 2026.09 或 3.5 當成編號。 */
function briefItems(body){
  var t=String(body).trim(),NUM=/^\d{1,2}\s*[.．]\s*[^\d\s]/;
  var parts=t.split(/\s+(?=\d{1,2}\s*[.．]\s*[^\d\s])/);
  // 只有一件事的那幾天也要當條列，不然「1.」會原封不動留在文字裡
  if(parts.length<2&&!NUM.test(t))return null;
  return parts.map(function(p){return p.trim().replace(/^\d{1,2}\s*[.．]\s*/,'')})
    .filter(function(p){return p})}

function toggleMx(){
  MXOPEN=!MXOPEN;try{localStorage.setItem('mxOpen',MXOPEN?'1':'0')}catch(e){}
  mx(RAW&&RAW.metrics);header()}

function toggleBrief(){
  BOPEN=!BOPEN;localStorage.setItem('briefOpen',BOPEN?'1':'0');
  brief(RAW&&RAW.note);header()}

/** 千分位；整數不補小數，有小數才留兩位（單次成本才看得出差別） */
function n2(v){
  if(v===null||v===undefined||v==='')return '—';
  var n=Number(v);if(!isFinite(n))return '—';
  return n.toLocaleString('zh-TW',{maximumFractionDigits:n%1?2:0})}
function money(v){return v===null||v===undefined||v===''?'—':'$'+n2(v)}

/**
 * 生意數字列。看板連不到 Shopline 和 FB 廣告管理員，數字是 Cowork 的
 * daily-metrics skill 抓好寫進「指標」工作表的，這裡只負責顯示。
 */
function mx(m){
  var el=$('mx');
  if(!m||!MXOPEN){el.style.display='none';el.innerHTML='';return}
  el.style.display='';
  if(!m.has){
    el.innerHTML='<div class="miss">今日還沒有營運數字。在 Cowork 說「更新今日數據」，'+
      '它會去 Shopline 和 FB 廣告管理員抓一次填進來。</div>';
    return}
  var roas=m.roas,rc=roas===null?'na':(roas>=3?'good':(roas<1.5?'bad':''));
  el.innerHTML=
    tile('今日營業額',money(m.revenue),m.orders===null?'':n2(m.orders)+' 筆訂單')+
    tile('廣告花費',money(m.spend),'')+
    tile('ROAS',roas===null?'—':n2(roas)+'x','花一元換回來的',rc)+
    tile('流量',n2(m.clicks),m.cpc===null?'':'一次 '+money(m.cpc))+
    tile('加入購物車',n2(m.carts),m.cpaCart===null?'':'一次 '+money(m.cpaCart))+
    (m.updated?'<div class="up">'+esc(String(m.updated).slice(11,16))+' 更新</div>':'')}

function tile(label,val,sub,cls){
  return '<div class="m'+(cls?' '+cls:'')+'"><u>'+esc(label)+'</u><b>'+esc(val)+'</b>'+
    (sub?'<s>'+esc(sub)+'</s>':'')+'</div>'}

function col(cls,icon,title,cards,empty){
  return '<section class="col '+cls+'" data-drop="'+cls.slice(2)+'"><h3><i>'+icon+'</i>'+title+'<b>'+cards.length+'</b></h3>'+
    (cards.length?cards.join(''):'<div class="none">'+esc(empty)+'</div>')+
    '<button class="add" onclick="openAdd(\'task\',\''+cls.slice(2)+'\')">＋ 新增任務</button></section>'}

/** col 是這張卡目前在哪一欄（run/today/tmr），用來決定動作列要出現哪些「移到」按鈕。
    手機三欄是上下堆疊的，垂直拖曳會跟捲動打架，所以那邊靠這些按鈕，桌機才用拖的。 */
function taskCard(t,col){
  var td=today(),cls=t.due?(t.due<td?'over':(t.due===td?'now':'')):'';
  // 昨天沒做完的今天照樣出現在「今日工作」，但到期日不會被改掉——
  // 改掉就再也看不出這件本來哪天該交。所以標示成「順延 N 天 · 需完成 9/3」。
  var lbl=t.due?(t.due<td?'順延 '+daysBetween(t.due,td)+' 天 · 需完成 '+md(t.due)
      :(t.due===td?'今天':(t.due===ymd(new Date(Date.now()+864e5))?'明天':md(t.due)))):'未排日期';
  var a=(t.status!=='進行中'?'<button class="go" onclick="event.stopPropagation();toCol(\''+t.id+'\',\'run\',\''+(col||'')+'\')">開始</button>':'')+
    '<button class="ok" onclick="st(\''+t.id+'\',\'完成\')">完成 ✓</button>'+
    (col!=='today'?'<button onclick="event.stopPropagation();toCol(\''+t.id+'\',\'today\',\''+(col||'')+'\')">移到今日</button>':'')+
    (col!=='tmr'?'<button onclick="event.stopPropagation();toCol(\''+t.id+'\',\'tmr\',\''+(col||'')+'\')">移到明日</button>':'')+
    '<button onclick="edit(\''+t.id+'\')">編輯</button>';
  var sub=(t.project?'<em>'+esc(t.project)+'</em>':'')+
    (t.waiting?'<b>等待者：</b>'+esc(t.waiting):(t.next?'<b>下一步：</b>'+esc(t.next):''));
  return '<article class="t p'+t.priority+'" data-id="'+t.id+'" title="'+PN[t.priority]+'">'+
    '<div class="ti">'+ownerMark(t.owner)+esc(t.title)+'</div>'+
    '<div class="meta"><div class="nx">'+sub+'</div>'+
      '<div class="dd '+cls+'">📅 '+lbl+'</div></div>'+
    '<div class="acts">'+a+'</div></article>'}

/** 交給 AI 的事在標題前面掛個記號，一眼看得出這件不用自己動手 */
function ownerMark(o){
  o=o||'我';
  if(o==='AI')return '<i class="own" title="交給 AI">🤖</i>';
  if(o==='一起')return '<i class="own" title="AI 做初稿、自己收尾">🤝</i>';
  return ''}

function logCard(l){
  return '<article class="t live"><div class="ti">'+esc(l.title)+'</div>'+
    '<div class="tags"><span class="tag src">'+esc(l.source)+' 執行中</span>'+
      (l.project?'<span class="tag pj">'+esc(l.project)+'</span>':'')+'</div>'+
    '<div class="meta"><div class="nx">'+esc(l.summary||'')+'</div>'+
      '<div class="dd">🕐 '+String(l.start).slice(11,16)+' 起</div></div></article>'}

function stats(r){
  var s=r.stats,pct=s.weekTotal?Math.round(s.weekDone*100/s.weekTotal):0,C=2*Math.PI*20;
  var dlt='';
  if(s.focusHoursPrev>0){var p=Math.round((s.focusHours-s.focusHoursPrev)*100/s.focusHoursPrev);
    if(p)dlt='<em class="'+(p<0?'dn':'')+'">'+(p>0?'▲':'▼')+' '+Math.abs(p)+'%</em>'}
  else if(s.focusHours>0)dlt='<em>▲ 新增</em>';
  return '<div class="stats">'+
    '<div class="st goal"><div class="k">🎯 今日專注目標</div><div class="u">'+
      (r.note?esc(r.note.split('\n').filter(function(x){return x.trim()}).slice(-2).join(' '))
        :'尚未產生早晨簡報。先把優先處理的做掉，再談其他。')+'</div></div>'+
    '<div class="st"><div class="k">已完成任務</div><div class="v">'+s.doneToday+'<small>/ '+s.totalToday+'</small></div></div>'+
    '<div class="st"><div class="k">優先任務占比</div><div class="v" style="color:var(--b)">'+s.highValuePct+'%</div>'+
      '<div class="bar"><i style="width:'+s.highValuePct+'%"></i></div></div>'+
    '<div class="st"><div class="k">專注時間</div><div class="v">'+s.focusHours+'<small>小時</small>'+dlt+'</div>'+
      '<div class="u">昨天 '+s.focusHoursPrev+' 小時</div></div>'+
    '<div class="st"><div class="k">本週進度</div>'+
      '<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="#1c202a" stroke-width="4"/>'+
      '<circle cx="23" cy="23" r="20" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"'+
      ' stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct/100)).toFixed(1)+'" transform="rotate(-90 23 23)"/>'+
      '<text x="23" y="27" text-anchor="middle" fill="#8b93a1" font-size="11" font-weight="700">'+pct+'%</text></svg>'+
      '<div class="v">'+s.weekDone+'<small>/ '+s.weekTotal+'</small></div></div>'+
    '</div>'}

/* ---------------- projects / pool ---------------- */
/** 側邊欄的專案池拿掉之後，這裡只剩下「專案」輸入框的自動完成清單 */
function renderPjs(ps){
  $('pjs').innerHTML=ps.map(function(p){return '<option value="'+esc(p.name)+'">'}).join('')}

function allTasks(r){
  r=r||{};
  var a=(r.running||[]).concat(r.today||[],r.tomorrow||[],r.unscheduled||[],r.tasks||[]);
  (r.projects||[]).forEach(function(p){if(p.tasks)a=a.concat(p.tasks)});
  (r.order||[]).forEach(function(o){a.push(o.task)});
  return a}
function projects(r,q){
  var f=function(a){return a.filter(function(x){return hit(x,q)})};
  var head='<div class="wrap">'+
    '<div class="panelbox" style="display:flex;gap:26px;flex-wrap:wrap">'+
      kpi('區間',RNAME[r.range]+(r.range==='day'?'':' · '+r.from+' – '+r.to))+
      kpi('實際紀錄',r.logs.length+' 筆 · '+logHours(r.logs)+' 小時')+
      kpi('Claude Code',cntSrc(r.logs,'Claude Code')+' 筆')+
      kpi('Cowork',cntSrc(r.logs,'Cowork')+' 筆')+
    '</div>';
  var body=r.range==='month'?monthCal(r,f,false):timeCal(r,f);
  return head+body+
    '<div class="legend">'+
      '<span><i style="background:#34d399"></i>Claude Code</span>'+
      '<span><i style="background:#e0a03a"></i>Cowork</span>'+
      '<span><i style="background:#4ea3f5"></i>手動</span>'+
      '<span>這頁只畫實際跑過的紀錄；任務排在哪一天請看「看板總覽」</span>'+
    '</div>'+
    '</div>'}

function cntSrc(logs,src){
  return logs.filter(function(l){return l.source===src}).length}

function logHours(logs){
  var m=0;logs.forEach(function(l){var a=tmin(l.start),b=tmin(l.end);
    if(a!=null&&b!=null&&b>a)m+=b-a});
  return Math.round(m/6)/10}

/** 'yyyy-MM-dd HH:mm' → 當天的第幾分鐘；沒有時間就回 null */
function tmin(s){var m=String(s||'').match(/ (\d{2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
function days(from,to){var a=[],d=parse(from),e=parse(to);
  while(d<=e){a.push(ymd(d));d.setDate(d.getDate()+1)}return a}
function srcCls(s){return s==='Claude Code'?'cc':(s==='Cowork'?'cw2':'mn')}

/* ---- 日／週：上方全天列放任務，下方時間軸放紀錄 ---- */
function timeCal(r,f){
  var ds=days(r.from,r.to),td=today(),H=Math.round(44*Z);
  var logs=f(r.logs);

  // 時間軸範圍跟著實際紀錄伸縮，預設 8–19 點
  var lo=8*60,hi=19*60;
  logs.forEach(function(l){var a=tmin(l.start),b=tmin(l.end);
    if(a!=null){lo=Math.min(lo,a);hi=Math.max(hi,b==null?a+60:b)}});
  lo=Math.floor(lo/60)*60;hi=Math.min(24*60,Math.ceil(hi/60)*60);
  if(hi<=lo)hi=lo+60;
  var hrs=(hi-lo)/60;

  var byDay={};
  logs.forEach(function(l){(byDay[String(l.start).slice(0,10)]=byDay[String(l.start).slice(0,10)]||[]).push(l)});

  var style='--n:'+ds.length+';--gut:'+Math.round(52*Z)+'px;--h:'+H+'px';
  var h='<div class="cw" style="'+style+'">'+
    '<div class="crow chead"><div>GMT+8</div>'+ds.map(function(d){
      var x=parse(d);
      return '<div class="'+(d===td?'today':'')+'"><div class="wd">週'+'日一二三四五六'[x.getDay()]+
        '</div><div class="dn">'+x.getDate()+'</div></div>'}).join('')+'</div>'+
    '<div class="cbody"><div class="crow">'+
      '<div class="gut">'+Array.apply(null,{length:hrs}).map(function(_,i){
        return '<div>'+(lo/60+i)+':00</div>'}).join('')+'</div>'+
      ds.map(function(d){
        var x=parse(d),wknd=x.getDay()===0||x.getDay()===6;
        var slots=Array.apply(null,{length:hrs}).map(function(){return '<div class="hr"></div>'}).join('');
        return '<div class="dcol'+(wknd?' wknd':'')+(d===td?' tdy':'')+'">'+slots+
          lay(byDay[d]||[],lo,hi,H)+(d===td?nowLine(lo,hi,H):'')+'</div>'}).join('')+
    '</div></div></div>';
  return h}

/** 同一天的紀錄鋪到時間軸上；時間重疊的並排，不要互相蓋住 */
function lay(logs,lo,hi,H){
  var evs=logs.map(function(l){
    var a=tmin(l.start),b=tmin(l.end);
    if(a==null)return null;
    if(b==null||b<=a)b=Math.min(a+30,hi);       // 還在跑的畫 30 分鐘
    return {l:l,a:Math.max(a,lo),b:Math.min(b,hi),live:tmin(l.end)==null}
  }).filter(function(e){return e&&e.b>lo&&e.a<hi}).sort(function(p,q){return p.a-q.a});

  var out='',i=0;
  while(i<evs.length){
    var g=[evs[i]],end=evs[i].b,j=i+1;
    while(j<evs.length&&evs[j].a<end){g.push(evs[j]);end=Math.max(end,evs[j].b);j++}
    g.forEach(function(e,k){
      var w=100/g.length,top=(e.a-lo)/60*H,ht=Math.max(18,(e.b-e.a)/60*H-2);
      out+='<div class="ev '+srcCls(e.l.source)+(e.live?' run':'')+'" data-log="'+esc(e.l.id)+'" style="top:'+top.toFixed(1)+
        'px;height:'+ht.toFixed(1)+'px;left:calc('+(w*k)+'% + 2px);width:calc('+w+'% - 4px)" title="'+
        esc(e.l.title)+'"><b>'+esc(e.l.title)+'</b>'+
        (ht>32?'<s>'+String(e.l.start).slice(11,16)+(e.live?' 起 · 執行中':'–'+String(e.l.end).slice(11,16))+
          (e.l.project?' · '+esc(e.l.project):'')+'</s>':'')+'</div>'});
    i=j}
  return out}

function nowLine(lo,hi,H){
  var d=new Date(),m=d.getHours()*60+d.getMinutes();
  if(m<lo||m>hi)return '';
  return '<div class="nowline" style="top:'+((m-lo)/60*H).toFixed(1)+'px"></div>'}

/* ---- 月：格子裡放任務，附當天紀錄筆數 ---- */
/** showTasks=false 就只畫紀錄筆數，不畫任務——「AI 工作時間表」用這個模式 */
function monthCal(r,f,showTasks){
  var first=parse(r.from),td=today(),m=first.getMonth();
  var start=new Date(first);start.setDate(1-((first.getDay()+6)%7));   // 補到週一
  var last=parse(r.to),end=new Date(last);end.setDate(last.getDate()+(7-((last.getDay()+6)%7)-1));

  var tByDay={},nByDay={};
  f(r.tasks).forEach(function(t){if(t.due)(tByDay[t.due]=tByDay[t.due]||[]).push(t)});
  f(r.logs).forEach(function(l){var d=String(l.start).slice(0,10);nByDay[d]=(nByDay[d]||0)+1});

  var h='<div class="mgrid">'+['一','二','三','四','五','六','日'].map(function(w){
    return '<div class="mh">週'+w+'</div>'}).join('');
  for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    var k=ymd(d),ts=tByDay[k]||[],n=nByDay[k]||0;
    h+='<div class="mc'+(d.getMonth()!==m?' out':'')+(k===td?' tdy':'')+'">'+
      '<div class="d">'+d.getDate()+'</div>'+
      (showTasks===false?'':ts.slice(0,3).map(dayChip).join(''))+
      (showTasks!==false&&ts.length>3?'<div class="more">還有 '+(ts.length-3)+' 件</div>':'')+
      (n?'<div class="more">● '+n+' 筆紀錄</div>':'')+'</div>'}
  return h+'</div>'}

/** 日曆格子裡的一件任務。點下去就是編輯，跟卡片同一套。 */
function dayChip(t){
  return '<button class="chip2 '+t.priority+(t.status==='完成'?' dn2':'')+
    '" data-id="'+esc(t.id)+'" title="'+esc(t.title)+'">'+esc(t.title)+'</button>'}

/* ---------------- 看板總覽 ----------------
   跟「AI 工作時間表」看的是同一份資料，但這裡只管任務排在哪一天、做完了沒，
   不畫實際執行的時間軸。週看七格、月看整月，上下一段用標題列的 ‹ › 切。 */
function overview(r,q){
  var f=function(a){return a.filter(function(x){return hit(x,q)})};
  var ts=f(r.tasks),td=today();
  var done=ts.filter(function(t){return t.status==='完成'}).length;
  var over=ts.filter(function(t){return t.status!=='完成'&&t.due&&t.due<td}).length;
  return '<div class="wrap">'+
    '<div class="panelbox" style="display:flex;gap:26px;flex-wrap:wrap">'+
      kpi('區間',RNAME[r.range]+' · '+r.from+' – '+r.to)+
      kpi('任務',done+' / '+ts.length+' 完成')+
      kpi('逾期未完成',over+' 件')+
      kpi('未排日期',r.unscheduled.length+' 件')+
    '</div>'+
    (r.range==='month'?monthCal(r,f):weekGrid(r,f))+
    (r.unscheduled.length?'<div class="sec">未排日期 '+r.unscheduled.length+'</div>'+
      f(r.unscheduled).map(function(t){return taskCard(t,'')}).join(''):'')+
    '</div>'}

/** 一週七格。任務照到期日放；已完成但沒排日期的，用完成日放。 */
function weekGrid(r,f){
  var td=today(),by={};
  f(r.tasks).forEach(function(t){
    var k=t.due||String(t.done_at||'').slice(0,10);
    if(k)(by[k]=by[k]||[]).push(t)});
  var h='<div class="mgrid mweek">',wd='日一二三四五六';
  for(var d=parse(r.from);ymd(d)<=r.to;d.setDate(d.getDate()+1)){
    var k=ymd(d),ts=by[k]||[];
    h+='<div class="mc'+(k===td?' tdy':'')+'" data-date="'+k+'">'+
      '<div class="wd">週'+wd[d.getDay()]+'</div><div class="d">'+d.getDate()+'</div>'+
      (ts.length?ts.map(dayChip).join(''):'<div class="more">—</div>')+'</div>'}
  return h+'</div>'}

function kpi(k,v){return '<div><div class="k" style="font-size:12px;color:var(--dim)">'+esc(k)+
  '</div><div style="font-size:17px;font-weight:700;margin-top:3px">'+esc(v)+'</div></div>'}

/* ---------------- AI 專案池 ---------------- */
function pool(r,q){
  var order=r.order.filter(function(o){return hit(o.task,q)});
  var h='<div class="wrap">'+
    '<div class="panelbox" style="display:flex;gap:26px;flex-wrap:wrap">'+
      kpi('交給 AI',r.backlog+' 件')+
      kpi('逾期',r.overdue+' 件')+
      kpi('自己要做',(r.mine||0)+' 件')+
      kpi('昨天',r.yesterday.length+' 筆 · '+r.yesterdayHours+' 小時')+
    '</div>';

  h+='<div class="sec">建議順序</div>';
  h+=order.length?'<div class="panelbox" style="padding:8px 10px">'+order.map(function(o,i){
      var t=o.task;
      return '<div class="rank"><b>'+(i+1)+'</b><div class="grow" style="min-width:0">'+
        '<div class="rt">'+esc(t.title)+'</div>'+
        '<div class="rs">'+esc(o.reason)+(t.project?' · '+esc(t.project):'')+
          (t.next?' · 下一步：'+esc(t.next):'')+'</div></div>'+
        '<span class="tag '+t.priority+'">'+t.priority+'</span>'+
        '<button class="chip" onclick="toCol(\''+t.id+'\',\'run\',\'\')">開始</button></div>'
    }).join('')+'</div>'
    :'<div class="none">'+(r.mine?'目前沒有交給 AI 的事——自己手上還有 '+r.mine+
      ' 件。哪幾件想丟出去？點卡片編輯，把「誰做」改成 AI。'
      :'沒有待辦。')+'</div>';

  // 兩個 AI 各自一欄，才看得出昨天是誰在做事、誰整天沒動靜
  var ys=r.yesterday.filter(function(l){return hit(l,q)});
  var by=function(src){return ys.filter(function(l){return l.source===src})};
  var other=ys.filter(function(l){return l.source!=='Cowork'&&l.source!=='Claude Code'});
  h+='<div class="sec">昨天執行的內容</div>'+
    '<div class="srcs">'+
      logCol('Cowork','cw2',by('Cowork'),'昨天 Cowork 沒有跑任何任務。')+
      logCol('Claude Code','cc',by('Claude Code'),
        '昨天 Claude Code 沒有紀錄。要自動進來，得在自己的電腦裝好 hook；跑在雲端的 session 送不出來。')+
      (other.length?logCol('手動與其他','mn',other,''):'')+
    '</div>';

  // 依 A/B/C 分三塊，不再依專案分——決定「現在做哪一件」時看的是輕重，不是屬於誰
  var left=[];
  r.projects.forEach(function(p){left=left.concat(p.tasks||[])});
  left=left.filter(function(t){return hit(t,q)});
  h+='<div class="sec">還剩什麼</div>';
  ['A','B','C'].forEach(function(p){
    var ts=left.filter(function(t){return t.priority===p});
    var od=ts.filter(function(t){return t.due&&t.due<today()}).length;
    h+='<div class="panelbox"><h3><span class="tag '+p+'">'+p+'</span> '+esc(PN[p].slice(2))+
      ' <b class="cnt">'+ts.length+'</b>'+
      (od?' <span class="tag A">逾期 '+od+'</span>':'')+'</h3>'+
      (ts.length?ts.map(function(t){return taskCard(t,'')}).join('')
        :'<div class="none">'+(p==='A'?'沒有交給 AI 的 A 級工作。':'沒有')+'</div>')+
      '</div>'});
  return h+'</div>'}

/** 昨天某個來源做過的事，一欄。標題帶顏色點，跟日曆的來源色一致。 */
function logCol(name,cls,logs,empty){
  return '<section class="srcc"><h4><i class="dot '+cls+'"></i>'+esc(name)+
    '<b>'+logs.length+'</b></h4>'+
    (logs.length?logs.map(logRow).join(''):'<div class="none">'+esc(empty)+'</div>')+
    '</section>'}

/* ---------------- 資料區 ---------------- */
/** 分區是使用者自己開的，標題點一下就能改。對不到分區的卡片歸「未分類」。 */
function notes(r,q){
  var byS={};
  r.items.filter(function(x){return hit(x,q)||hit({title:x.title,summary:x.body},q)})
    .forEach(function(x){(byS[x.section]||(byS[x.section]=[])).push(x)});
  var known={};r.sections.forEach(function(s){known[s.id]=1});
  var loose=[];Object.keys(byS).forEach(function(k){if(!known[k])loose=loose.concat(byS[k])});

  var cols=(loose.length?[sectCol({id:'',name:'未分類',color:'dim'},loose,1)]:[])
    .concat(r.sections.map(function(sc){return sectCol(sc,byS[sc.id]||[],0)}));

  return '<div class="notes">'+cols.join('')+
    '<button class="addsec" onclick="newSect()">＋ 新增分區</button></div>'}

function sectCol(sc,items,fixed){
  return '<section class="ncol s-'+esc(sc.color||'acc')+'" data-sect="'+esc(sc.id)+'">'+
    '<h3>'+(fixed?'<b>'+esc(sc.name)+'</b>'
      :'<b contenteditable="true" spellcheck="false" data-id="'+esc(sc.id)+'" '+
        'onblur="renameSect(this)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+
        esc(sc.name)+'</b>')+
      '<span>'+items.length+'</span>'+
      (fixed?'':'<button class="x" onclick="delSect(\''+sc.id+'\',\''+esc(sc.name)+'\','+items.length+')" title="刪除分區">×</button>')+
    '</h3>'+
    items.map(noteCard).join('')+
    '<button class="add" onclick="newItem(\''+esc(sc.id)+'\',this)">＋ 新增</button></section>'}

function noteCard(x){
  var body=String(x.body||''),url=/^https?:\/\/\S+$/.test(body.trim())?body.trim():'';
  var rest=body.split('\n').slice(1).join('\n').trim();
  return '<article class="nc" data-item="'+esc(x.id)+'">'+
    '<button class="x" onclick="delItem(event,\''+x.id+'\')" title="刪除">×</button>'+
    '<div class="ti">'+esc(x.title)+'</div>'+
    (url?'<a class="u" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(url)+'</a>'
       :(rest?'<div class="b">'+esc(rest)+'</div>':''))+
    '</article>'}

/** 第一行當標題，整段存進 body */
function head1(t){
  var l=String(t).split('\n').filter(function(x){return x.trim()})[0]||'';
  return l.trim().slice(0,60)}

/**
 * 就地編輯：Enter 存檔（Shift+Enter 換行）、Esc 取消、點別處也存。
 * done 旗標避免 Esc 移除元素後 blur 又跑一次。
 */
function inline(el,save,cancel){
  var done=false;
  function fin(ok){
    if(done)return;done=true;
    var t=(el.value!==undefined?el.value:el.textContent).trim();
    ok?save(t):cancel()}
  el.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();fin(1)}
    else if(e.key==='Escape'){e.preventDefault();fin(0)}});
  el.addEventListener('blur',function(){fin(1)});
  el.focus();
  if(el.value!==undefined)el.setSelectionRange(el.value.length,el.value.length)}

function findItem(id){
  var a=(RAW&&RAW.items)||[];
  for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}

/** 資料區的本地改動：找到那張卡片就地改，畫面立刻反應 */
function localItem(id,patch){
  if(!RAW||!RAW.items)return false;
  for(var i=0;i<RAW.items.length;i++)if(RAW.items[i].id===id){
    if(patch===null)RAW.items.splice(i,1);
    else Object.keys(patch).forEach(function(k){RAW.items[i][k]=patch[k]});
    return true}
  return false}

function newSect(){
  var wrap=document.querySelector('.notes');
  if(!wrap||wrap.querySelector('.ncol.new'))return;
  var el=document.createElement('section');
  el.className='ncol s-acc new';
  el.innerHTML='<h3><b contenteditable="true" spellcheck="false" data-ph="分區名稱"></b></h3>';
  wrap.insertBefore(el,wrap.querySelector('.addsec'));
  inline(el.querySelector('b'),function(t){
    if(!t)return el.remove();
    mutate('sect_save',{name:t})},
    function(){el.remove()})}

function renameSect(el){
  var n=el.textContent.trim(),id=el.dataset.id,cur=findSect(id);
  if(!n||!cur||n===cur.name){if(cur)el.textContent=cur.name;return}
  mutate('sect_save',{id:id,name:n},function(){
    var sc=findSect(id);if(!sc)return false;sc.name=n;return true})}

function findSect(id){
  var a=(RAW&&RAW.sections)||[];
  for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}

function delSect(id,name,n){
  if(!confirm('刪掉分區「'+name+'」？'+(n?'裡面的 '+n+' 張卡片不會被刪，會移到「未分類」。':'')))return;
  mutate('sect_del',{id:id},function(){
    RAW.sections=RAW.sections.filter(function(x){return x.id!==id});return true})}

function newItem(sect,btn){
  var col=btn.closest('.ncol');
  if(col.querySelector('.nc.edit'))return;
  var el=document.createElement('article');
  el.className='nc edit';
  el.innerHTML='<textarea rows="2" placeholder="輸入內容或貼上網址　Enter 存檔"></textarea>';
  col.insertBefore(el,btn);
  inline(el.querySelector('textarea'),function(t){
    if(!t)return el.remove();
    el.remove();
    mutate('item_save',{section:sect,body:t,title:head1(t)},function(){
      RAW.items.push({id:'tmp'+Date.now(),section:sect,title:head1(t),body:t,order:9e9});
      return true})},
    function(){el.remove()})}

function editItem(id,card){
  var x=findItem(id);if(!x||card.classList.contains('edit'))return;
  var was=String(x.body||x.title);
  card.classList.add('edit');
  card.innerHTML='<textarea rows="3"></textarea>';
  var ta=card.querySelector('textarea');ta.value=was;
  inline(ta,function(t){
    if(!t||t===was)return paint();
    mutate('item_save',{id:id,body:t,title:head1(t)},function(){
      return localItem(id,{body:t,title:head1(t)})})},
    paint)}

function delItem(e,id){
  e.stopPropagation();
  var x=findItem(id);
  if(!confirm('刪掉「'+((x&&x.title)||'這張卡片')+'」？'))return;
  mutate('item_del',{id:id},function(){return localItem(id,null)})}

function moveItem(id,sect){
  mutate('item_save',{id:id,section:sect},function(){return localItem(id,{section:sect})})
    .then(function(){toast('已移動')})}

/* ---------------- 完成項目 ---------------- */
function done(r,q){
  var items=r.items.filter(function(x){return hit(x,q)});
  var head='<div class="wrap">'+
    '<div class="panelbox" style="display:flex;gap:26px;flex-wrap:wrap">'+
      kpi('完成',r.total+' 項')+
      kpi('有產出',r.withLink+' 項')+
      kpi('累計時數',r.hours+' 小時')+
      kpi('區間',r.range==='all'?'全部':r.from+' – '+r.to)+
    '</div>';
  if(!items.length)return head+'<div class="none">這段期間沒有完成項目</div></div>';

  var by={},order=[];
  items.forEach(function(x){var d=String(x.at).slice(0,10);
    if(!by[d]){by[d]=[];order.push(d)}by[d].push(x)});
  return head+order.map(function(d){
    return '<div class="sec">'+d+' · '+by[d].length+' 項</div>'+by[d].map(doneRow).join('')
  }).join('')+'</div>'}

function doneRow(x){
  return '<div class="lg dn3'+(x.kind==='task'?' tk':'')+'">'+
    '<div class="ti">✓ '+esc(x.title)+'</div>'+
    '<div class="tags"><span class="tag src">'+esc(x.source)+'</span>'+
      (x.project?'<span class="tag pj">'+esc(x.project)+'</span>':'')+
      (x.priority?'<span class="tag '+x.priority+'">'+x.priority+'</span>':'')+
      '<span class="tag pj">'+String(x.at).slice(11,16)+'</span></div>'+
    (x.summary?'<div class="sm">'+esc(x.summary)+'</div>':'')+
    (x.link?'<a class="url" href="'+esc(x.link)+'" target="_blank" rel="noopener">🔗 '+esc(x.link)+'</a>':'')+
    (x.path?'<div class="url path" onclick="copyPath(this)" title="點一下複製">📁 '+esc(x.path)+'</div>':'')+
    '</div>'}

/** 寫入用這個：在看板頁時請伺服器把新的看板一起回來，一趟就完成，不用先更新再重抓 */
/**
 * 寫入。opt 是「先在本地把畫面改好」的函式，回傳 true 表示有改到，
 * 這樣按下去是即時的；伺服器回來的權威資料再覆蓋一次，有出入會自動修正。
 */
function mutate(action,params,opt){
  if(VIEW==='board')params.board=1;
  var did=!!(opt&&opt());if(did)paint();
  busy(1);
  return call(action,params).then(function(r){
    busy(0);
    if(r.board){VC['board:'+(DATE||today())]=r.board;settle(r.board)}
    else if(r.data){VC.notes=r.data;settle(r.data)}
    else if(did)VC[vkey()]=RAW;        // 已經就地更新過了，不用整頁重抓
    else{VC={};load()}
    return r})
   .catch(function(e){busy(0);toast(e.message);VC={};load()})}

/** 把一筆紀錄的改動就地套進目前這頁的資料，日曆才會馬上改字 */
function applyLog(id,patch){

  Object.keys(patch).forEach(function(k){if(k!=='id')l[k]=patch[k]});
  return true}

/**
 * 把一筆任務的改動就地套進看板資料，分欄規則跟後端 board_ 一致
 * （drag.test.js 會拿同一批資料比對兩邊的分欄結果，避免這裡跟後端走鐘）。
 */
function applyTask(b,id,patch){
  if(!b||!b.running)return false;
  var all=b.running.concat(b.today,b.tomorrow,b.unscheduled),t=null;
  all.forEach(function(x){if(x.id===id)t=x});
  if(!t)return false;
  Object.keys(patch).forEach(function(k){if(patch[k]!==undefined)t[k]=patch[k]});
  var td=b.date,tm=ymd(new Date(parse(b.date).getTime()+864e5));
  var open=all.filter(function(x){return x.status==='待辦'||x.status==='進行中'});
  open.sort(function(a,c){                     // 跟後端 sortTasks_ 同一套規則
    var da=a.due||'9999-99-99',dc=c.due||'9999-99-99';
    if(da!==dc)return da<dc?-1:1;
    if(a.priority!==c.priority)return 'ABC'.indexOf(a.priority)-'ABC'.indexOf(c.priority);
    return a.id<c.id?-1:(a.id>c.id?1:0)});
  b.running=open.filter(function(x){return x.status==='進行中'});
  var rest=open.filter(function(x){return x.status!=='進行中'});
  b.today=rest.filter(function(x){return x.due&&x.due<=td});
  b.tomorrow=rest.filter(function(x){return x.due===tm});
  b.unscheduled=rest.filter(function(x){return !x.due});
  return true}

/* ---------------- 拖曳換欄 ----------------
   丟到「AI 正執行工作」＝開始做；丟到今日/明日＝改到期日。
   從執行中拖出來會一併退回待辦。滑鼠移動一點就接手，手指則要橫move或長按，
   免得跟捲動打架。紀錄卡（AI session）沒有 data-id，不能拖。            */
var PRESS=null,DRAG=null,NODRAG=0;
var DROP={run:'AI 正執行工作',today:'今日工作',tmr:'明日工作'};

/* 三種可以拖的東西，差別只在「從哪裡拖」「放到哪裡」「放下去要送什麼」：
   看板卡片換欄、資料區卡片換分區、看板總覽週格子裡的任務換日期。 */
var DKIND={
  t:   { sel:'.t[data-id]',     col:'.col[data-drop]',  key:'drop', id:'id',   cls:'t'     },
  nc:  { sel:'.nc[data-item]',  col:'.ncol[data-sect]', key:'sect', id:'item', cls:'nc'    },
  chip:{ sel:'.chip2[data-id]', col:'.mc[data-date]',   key:'date', id:'id',   cls:'chip2' }
};
var DKEYS=['t','nc','chip'];

function colOf(el,k){
  if(!el||!el.closest)return null;
  return el.closest(k?DKIND[k].col:'.col[data-drop],.ncol[data-sect],.mc[data-date]')}

function press(e){
  if(e.button)return;
  var k=null,card=null;
  for(var i=0;i<DKEYS.length;i++){
    var c=e.target.closest&&e.target.closest(DKIND[DKEYS[i]].sel);
    if(c&&colOf(c,DKEYS[i])){k=DKEYS[i];card=c;break}
  }
  if(!card)return;
  // 卡片裡的按鈕不能拖；但週格子的任務本身就是一顆按鈕，那個要放行
  var btn=e.target.closest&&e.target.closest('button');
  if((btn&&btn!==card)||e.target.closest('a')||e.target.isContentEditable)return;
  clearPress();
  PRESS={card:card,k:k,id:card.dataset[DKIND[k].id],
    x:e.clientX,y:e.clientY,touch:e.pointerType!=='mouse'};
  if(PRESS.touch)PRESS.timer=setTimeout(function(){if(PRESS)lift(e.clientX,e.clientY)},380)}

function clearPress(){if(PRESS&&PRESS.timer)clearTimeout(PRESS.timer);PRESS=null}

function lift(x,y){
  var card=PRESS.card,k=PRESS.k,D=DKIND[k],r=card.getBoundingClientRect();
  var g=card.cloneNode(true);
  g.className=D.cls+' ghost';g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);
  var home=colOf(card,k);
  DRAG={id:PRESS.id,k:k,card:card,ghost:g,dx:x-r.left,dy:y-r.top,
    from:home.dataset[D.key],over:null};
  card.classList.add('lift');document.body.classList.add('dragging');
  clearPress();over(x,y)}

function over(x,y){
  DRAG.ghost.style.left=(x-DRAG.dx)+'px';DRAG.ghost.style.top=(y-DRAG.dy)+'px';
  var c=colOf(document.elementFromPoint(x,y),DRAG.k);
  if(c===DRAG.over)return;
  if(DRAG.over)DRAG.over.classList.remove('drop');
  var key=c&&c.dataset[DKIND[DRAG.k].key];
  var same=!c||key===undefined||key===DRAG.from;
  DRAG.over=c;if(!same)c.classList.add('drop');else DRAG.over=null}

function move(e){
  if(DRAG){over(e.clientX,e.clientY);return}
  if(!PRESS)return;
  var dx=e.clientX-PRESS.x,dy=e.clientY-PRESS.y;
  if(Math.abs(dx)+Math.abs(dy)<8)return;
  if(!PRESS.touch)return lift(e.clientX,e.clientY);
  if(Math.abs(dx)>Math.abs(dy)*1.4)return lift(e.clientX,e.clientY);
  clearPress()}                       // 手指往上下滑＝想捲動，放手

function drop(){
  clearPress();
  if(!DRAG)return;
  var k=DRAG.k,id=DRAG.id;
  var to=DRAG.over&&DRAG.over.dataset[DKIND[k].key];
  DRAG.ghost.remove();DRAG.card.classList.remove('lift');
  if(DRAG.over)DRAG.over.classList.remove('drop');
  document.body.classList.remove('dragging');
  var from=DRAG.from;DRAG=null;NODRAG=Date.now();
  if(to===undefined||to===null||to===from)return;
  if(k==='nc')return moveItem(id,to);
  if(k==='chip')return toDay(id,to);
  toCol(id,to,from)}

/** 週格子裡把任務拖到別天＝改到期日。就地更新，不用整頁重抓。 */
function toDay(id,due){
  return mutate('task_update',{id:id,due:due},function(){return applyDue(id,due)})
    .then(function(){toast('移到 '+md(due))})}

function applyDue(id,due){
  var a=(RAW&&RAW.tasks)||[];
  for(var i=0;i<a.length;i++)if(a[i]&&a[i].id===id){a[i].due=due;return true}
  return false}

document.addEventListener('pointerdown',press);
document.addEventListener('pointermove',move);
document.addEventListener('pointerup',drop);
document.addEventListener('pointercancel',drop);
// 拖曳中要擋掉捲動；平常不擋，所以這個監聽器不能是 passive
document.addEventListener('touchmove',function(e){if(DRAG)e.preventDefault()},{passive:false});

// 卡片點一下展開動作列；剛拖完那一下不算
$('view').addEventListener('click',function(e){
  if(Date.now()-NODRAG<250)return;
  var chip=e.target.closest&&e.target.closest('.chip2[data-id]');
  if(chip)return edit(chip.dataset.id);      // 它本身是按鈕，要排在下面那道防線前面
  if(e.target.closest('button')||e.target.closest('a'))return;
  var card=e.target.closest&&e.target.closest('.t[data-id]');
  if(card)return edit(card.dataset.id);
  var ev=e.target.closest&&e.target.closest('.ev[data-log]');
  if(ev)return editLog(ev.dataset.log);
  var nc=e.target.closest&&e.target.closest('.nc[data-item]');
  if(nc)editItem(nc.dataset.item,nc)});

document.addEventListener('click',function(){$('menu').classList.remove('on')});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeAdd();$('menu').classList.remove('on')}
  if(/input|textarea|select/i.test(e.target.tagName))return;
  if(e.key==='n'){e.preventDefault();openAdd('task')}
  if(e.key==='/'){e.preventDefault();$('q').focus()}});

boot();
</script>
</body>
</html>
