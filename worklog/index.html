<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>工作看板</title>
<style>
  :root{
    --bg:#0a0b0e; --panel:#101217; --card:#161920; --card2:#1c202a;
    --line:#232733; --line2:#303647;
    --ink:#e9ecf2; --mute:#8b93a1; --dim:#646c7b;
    --acc:#3b82f6; --acc2:#2563eb;
    --a:#f0556d; --b:#e0a03a; --c:#4ea3f5;
    --run:#f0556d; --today:#4ea3f5; --tmr:#a78bfa;
    --ok:#34d399; --warn:#fbbf24; --bad:#f0556d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  a{color:var(--acc);text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------- shell ---------------- */
  #app{display:none}
  .shell{display:flex;min-height:100vh}
  .side{width:238px;flex:0 0 238px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side.hide{display:none}
  .me{display:flex;align-items:center;gap:10px;padding:15px 16px 13px;flex:0 0 auto}
  .av{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:0 0 auto}
  .me b{font-size:15px;font-weight:600}
  .nav{padding:0 8px;flex:0 0 auto}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;margin-bottom:1px;
    border-radius:9px;color:var(--mute);font-size:14px;text-align:left}
  .nav button:hover{background:var(--card);color:var(--ink)}
  .nav button.on{background:var(--card2);color:var(--ink);font-weight:600}
  .nav i{font-style:normal;width:17px;text-align:center;font-size:14px;flex:0 0 auto;opacity:.85}
  .nav button.on i{opacity:1}
  .pool{margin-top:16px;padding:0 12px 16px;flex:1;overflow-y:auto;min-height:0}
  .pool h4{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;
    background:var(--panel);font-size:12px;color:var(--dim);font-weight:600;margin:0 4px 8px;padding:2px 0}
  .pool h4 button{color:var(--acc);font-size:12px}
  .pj{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--line2);
    border-radius:9px;padding:8px 10px;margin-bottom:6px;width:100%;text-align:left;display:block}
  .pj:hover{background:var(--card2)}
  .pj.pA{border-left-color:var(--a)} .pj.pB{border-left-color:var(--b)} .pj.pC{border-left-color:var(--c)}
  .pj .n{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:600;align-items:center}
  .pj .s{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fold{flex:0 0 auto;padding:10px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;
    display:flex;align-items:center;gap:7px}
  .fold:hover{color:var(--ink)}

  /* ---------------- header ---------------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:16px 24px 0}
  .top h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.015em;
    display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .top h1 i{font-style:normal;font-size:22px;flex:0 0 auto}
  .top h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .icon{width:34px;height:34px;border-radius:9px;color:var(--mute);display:grid;place-items:center;
    font-size:15px;position:relative}
  .icon:hover{background:var(--card);color:var(--ink)}
  .icon b{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);
    color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
  .srch{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:0 10px;height:34px}
  .srch input{background:none;border:0;outline:0;width:130px;font-size:13px}
  .srch input::placeholder{color:var(--dim)}
  .srch.off{display:none}
  .ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f0556d,#a78bfa);
    display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:0 0 auto}

  .sub{display:flex;align-items:center;gap:9px;padding:9px 24px 0;color:var(--mute);font-size:13.5px;flex-wrap:wrap}
  .sub .d{display:flex;align-items:center;gap:7px}
  .step{width:26px;height:26px;border-radius:7px;color:var(--dim);display:grid;place-items:center;font-size:13px}
  .step:hover{background:var(--card);color:var(--ink)}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:12.5px;color:var(--mute)}
  .chip:hover{color:var(--ink);border-color:var(--line2)}
  .chip.on{background:rgba(59,130,246,.14);border-color:var(--acc);color:#8fc4ff}
  .grow{flex:1}
  .btn{background:var(--acc2);border-radius:9px;padding:9px 15px;font-size:14px;font-weight:600;color:#fff;
    display:flex;align-items:center;gap:7px}
  .btn:hover{background:var(--acc)}
  .split{display:flex;align-items:stretch;position:relative}
  .split .btn{border-radius:9px 0 0 9px}
  .split .car{background:var(--acc2);border-radius:0 9px 9px 0;color:#fff;padding:0 9px;font-size:11px;
    border-left:1px solid rgba(255,255,255,.22)}
  .split .car:hover{background:var(--acc)}
  .menu{position:absolute;right:0;top:calc(100% + 5px);background:var(--panel);border:1px solid var(--line2);
    border-radius:10px;padding:5px;min-width:168px;z-index:12;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .menu.on{display:block}
  .menu button{display:block;width:100%;text-align:left;padding:8px 11px;border-radius:7px;font-size:13.5px;color:var(--mute)}
  .menu button:hover{background:var(--card2);color:var(--ink)}

  /* ---------------- columns ---------------- */
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 24px 8px;align-items:start}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px;min-width:0}
  .col>h3{display:flex;align-items:center;gap:8px;margin:0 4px 12px;font-size:15px;font-weight:700}
  .col>h3 i{font-style:normal;font-size:15px}
  .col>h3 b{margin-left:auto;font-size:13px;color:var(--dim);font-weight:600}
  .c-run h3{color:var(--run)} .c-today h3{color:var(--today)} .c-tmr h3{color:var(--tmr)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .c-run h3 i{animation:pulse 2.4s infinite}

  .t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;
    transition:border-color .12s,background .12s}
  .t:hover{border-color:var(--line2);background:var(--card2)}
  .t.live{background:linear-gradient(180deg,rgba(240,85,109,.08),transparent 60%);border-color:rgba(240,85,109,.28)}
  /* 優先級改用左側色帶，不佔一整排標籤 */
  .t.pA{border-left:3px solid var(--a)}
  .t.pB{border-left:3px solid var(--b)}
  .t.pC{border-left:3px solid var(--c)}
  .t .ti{font-size:15px;font-weight:600;line-height:1.4;word-break:break-word}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11.5px;font-weight:600;padding:2.5px 8px;border-radius:6px;white-space:nowrap}
  .tag.A{background:rgba(240,85,109,.15);color:#ff8095}
  .tag.B{background:rgba(224,160,58,.15);color:#e8b45c}
  .tag.C{background:rgba(78,163,245,.15);color:#7bbcff}
  .tag.src{background:rgba(52,211,153,.14);color:#4ade9e}
  .tag.pj{background:var(--card2);color:var(--mute);border:1px solid var(--line2)}
  .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:9px}
  .nx{font-size:12.5px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nx b{color:var(--dim);font-weight:500}
  .nx em{font-style:normal;color:var(--dim);margin-right:7px}
  .nx em::after{content:" ·";opacity:.6}
  .dd{font-size:12.5px;color:var(--dim);white-space:nowrap;flex:0 0 auto;display:flex;align-items:center;gap:4px}
  .dd.over{color:var(--bad);font-weight:600} .dd.now{color:var(--warn);font-weight:600}
  /* 拖曳換欄：手指直向留給捲動，橫向與長按才由我們接手 */
  .t[data-id]{cursor:grab;touch-action:pan-y}
  .t.lift{opacity:.28}
  .ghost{position:fixed;z-index:40;pointer-events:none;margin:0;cursor:grabbing;
    transform:rotate(-1.5deg);box-shadow:0 14px 34px rgba(0,0,0,.6);border-color:var(--acc)}
  .col.drop{background:rgba(59,130,246,.08);border-color:var(--acc)}
  .col.drop>h3 b{color:var(--acc)}
  .col.drop .add{border-color:var(--acc);color:var(--acc)}
  body.dragging{user-select:none;-webkit-user-select:none}
  .acts{display:none;gap:6px;margin-top:9px;flex-wrap:wrap}
  .t:hover .acts,.t.open .acts{display:flex}
  .acts button{background:var(--card2);border:1px solid var(--line2);border-radius:7px;
    padding:4px 9px;font-size:12px;color:var(--mute)}
  .acts button:hover{color:var(--ink);border-color:var(--dim)}
  .acts button.go{color:#8fc4ff;border-color:rgba(78,163,245,.32)}
  .acts button.ok{color:#4ade9e;border-color:rgba(52,211,153,.32)}
  .add{width:100%;border:1px dashed var(--line2);border-radius:10px;padding:9px;color:var(--dim);font-size:13px;margin-top:2px}
  .add:hover{color:var(--acc);border-color:var(--acc)}
  .none{color:var(--dim);font-size:12.5px;padding:12px 4px 16px;text-align:center}

  /* ---------------- stats ---------------- */
  .stats{display:grid;grid-template-columns:1.7fr repeat(4,1fr);gap:14px;
    margin:8px 24px 24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 18px}
  .st{min-width:0;position:relative}
  .st .k{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .st .v{font-size:25px;font-weight:700;letter-spacing:-.025em;line-height:1.1;display:flex;align-items:baseline;gap:6px}
  .st .v small{font-size:13.5px;color:var(--dim);font-weight:600}
  .st .v em{font-style:normal;font-size:12px;font-weight:600;color:var(--ok)}
  .st .v em.dn{color:var(--bad)}
  .st .u{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bar{height:4px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--b),var(--a))}
  .ring{position:absolute;right:0;top:14px;width:46px;height:46px}

  /* ---------------- generic views ---------------- */
  .wrap{padding:16px 24px 40px}
  .sec{font-size:12.5px;color:var(--dim);font-weight:600;margin:18px 2px 9px}
  .sec:first-child{margin-top:2px}
  .lg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
  .lg .sm{font-size:12.5px;color:var(--mute);margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .panelbox h3{margin:0 0 12px;font-size:15px}

  /* ---------------- 日曆（參考 Google 日曆） ---------------- */
  .cw{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .crow{display:grid;grid-template-columns:var(--gut) repeat(var(--n),minmax(0,1fr))}
  .chead{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:4}
  .chead>div{padding:7px 4px 8px;text-align:center;border-left:1px solid var(--line)}
  .chead>div:first-child{border-left:0;font-size:10.5px;color:var(--dim);display:flex;
    align-items:flex-end;justify-content:center;padding-bottom:10px}
  .wd{font-size:11.5px;color:var(--dim)}
  .dn{font-size:19px;font-weight:600;line-height:1.5;margin-top:1px}
  .chead .today .wd{color:var(--acc)}
  .chead .today .dn{background:var(--acc2);color:#fff;border-radius:50%;
    width:30px;height:30px;line-height:30px;margin:1px auto 0;font-weight:700;font-size:15px}
  .allday{border-bottom:1px solid var(--line);background:rgba(255,255,255,.012)}
  .allday>div{border-left:1px solid var(--line);padding:4px 3px;min-height:30px}
  .allday>div:first-child{border-left:0;font-size:10.5px;color:var(--dim);text-align:right;padding:6px 6px 0 0}
  .chip2{display:block;width:100%;text-align:left;font-size:11px;line-height:1.35;padding:2.5px 6px;
    border-radius:4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    border-left:3px solid}
  .chip2.A{background:rgba(240,85,109,.16);border-color:var(--a);color:#ff97a9}
  .chip2.B{background:rgba(224,160,58,.16);border-color:var(--b);color:#e8b45c}
  .chip2.C{background:rgba(78,163,245,.16);border-color:var(--c);color:#8cc4ff}
  .chip2.dn2{opacity:.4;text-decoration:line-through}
  .cbody{max-height:min(62vh,660px);overflow-y:auto;position:relative}
  .cbody .crow{position:relative}
  .gut{border-right:0}
  .gut div{height:var(--h);font-size:10.5px;color:var(--dim);text-align:right;
    padding-right:6px;transform:translateY(-7px)}
  .dcol{border-left:1px solid var(--line);position:relative}
  .dcol.wknd{background:rgba(255,255,255,.015)}
  .dcol.tdy{background:rgba(59,130,246,.05)}
  .hr{height:var(--h);border-bottom:1px solid var(--line)}
  .ev{position:absolute;border-radius:5px;padding:2px 5px;font-size:10.5px;line-height:1.3;
    overflow:hidden;border-left:3px solid;z-index:2}
  .ev b{display:block;font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev s{display:block;text-decoration:none;opacity:.75;font-size:10px}
  .ev.cc{background:rgba(52,211,153,.17);border-color:#34d399;color:#7ee7b4}
  .ev.cw2{background:rgba(224,160,58,.17);border-color:var(--b);color:#eec27a}
  .ev.mn{background:rgba(78,163,245,.17);border-color:var(--c);color:#9ccdff}
  .ev.run{border-style:dashed}
  .now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:5;pointer-events:none}
  .now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;
    border-radius:50%;background:var(--bad)}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line)}
  .mgrid>.mh{background:var(--panel);text-align:center;font-size:11.5px;color:var(--dim);padding:7px 0}
  .mc{background:var(--panel);min-height:104px;padding:5px 5px 6px}
  .mc.out{background:rgba(0,0,0,.22)}
  .mc.tdy{background:rgba(59,130,246,.06)}
  .mc .d{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:3px;text-align:right}
  .mc.tdy .d{color:#fff;background:var(--acc2);border-radius:50%;width:21px;height:21px;
    line-height:21px;text-align:center;margin:0 0 3px auto;font-size:11.5px}
  .mc .more{font-size:10.5px;color:var(--dim);padding-left:2px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:9px 4px 0;font-size:11.5px;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  @media(max-width:980px){
    .cbody{max-height:none}
    .chead .dn{font-size:16px} .chead .today .dn{width:26px;height:26px;line-height:26px;font-size:13px}
    .mc{min-height:74px;padding:3px} .chip2{font-size:10px;padding:2px 4px}
    .mc .d{font-size:11px}
  }
  .rank{display:flex;align-items:center;gap:11px;padding:9px 6px;border-bottom:1px solid var(--line)}
  .rank:last-child{border-bottom:0}
  .rank>b{width:22px;height:22px;border-radius:6px;background:var(--card2);color:var(--mute);
    font-size:12px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
  .rank:nth-child(1)>b{background:rgba(240,85,109,.18);color:#ff8095}
  .rank:nth-child(2)>b,.rank:nth-child(3)>b{background:rgba(224,160,58,.16);color:#e8b45c}
  .rank .rt{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .rs{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .chip{flex:0 0 auto}
  .url{display:block;margin-top:7px;font-size:12.5px;word-break:break-all;
    background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px}
  .url:hover{border-color:var(--acc)}
  .wk{display:flex;align-items:flex-end;gap:10px;height:130px;padding:4px 0}
  .wk .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .wk .bar2{width:100%;max-width:44px;background:var(--card2);border-radius:6px 6px 0 0;position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .wk .fill{background:linear-gradient(180deg,#34d399,#059669);border-radius:6px 6px 0 0}
  .wk .lab{font-size:11px;color:var(--dim);text-align:center;line-height:1.35}
  .wk .num{font-size:12px;font-weight:700}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--mute)}
  .kv b{font-weight:600}
  .code{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);word-break:break-all}

  /* ---------------- gate / modal ---------------- */
  #gate{display:none;max-width:380px;margin:0 auto;padding:14vh 22px}
  #gate h2{font-size:20px;margin:0 0 6px}
  #gate p{color:var(--mute);font-size:13px;margin:0 0 16px}
  #gate input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:11px 12px;font-size:15px}
  #gate button{width:100%;margin-top:10px;padding:12px;border-radius:10px;background:var(--acc2);color:#fff;font-size:15px;font-weight:600}
  #err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}

  .veil{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:20;align-items:center;justify-content:center;padding:20px}
  .veil.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line2);border-radius:16px;
    width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:18px}
  .sheet h3{margin:0 0 14px;font-size:17px}
  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:13px}
  .seg button.on{background:rgba(59,130,246,.14);border-color:var(--acc);color:#8fc4ff;font-weight:600}
  .f{margin-bottom:11px}
  .f label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .f input,.f select,.f textarea{width:100%;background:var(--card);border:1px solid var(--line2);
    border-radius:9px;padding:10px 11px;font-size:15px}
  .f textarea{resize:vertical;min-height:60px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .foot{display:flex;gap:9px;margin-top:16px}
  .foot button{flex:1;padding:11px;border-radius:10px;font-size:15px;font-weight:600;
    background:var(--card);border:1px solid var(--line2);color:var(--mute)}
  .foot button.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;
    background:#e9ecf2;color:#111;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;display:none}
  .spin{padding:56px;text-align:center;color:var(--dim)}
  .fab{display:none}

  /* ---------------- mobile ---------------- */
  @media(max-width:980px){
    .side{position:fixed;z-index:18;box-shadow:0 0 40px rgba(0,0,0,.6)}
    .side:not(.show){display:none}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:17;display:none}
    .scrim.on{display:block}
    .top{padding:12px 14px 0;gap:10px}
    .top h1{font-size:19px} .top h1 i{font-size:18px}
    .srch{display:none}
    .top .split{display:none}
    .sub{padding:8px 14px 0;gap:7px}
    .cols{grid-template-columns:1fr;gap:12px;padding:12px 14px 84px}
    .stats{grid-template-columns:1fr 1fr;margin:0 14px 84px;gap:16px;padding:14px}
    .st.goal{grid-column:1/-1}
    .wrap{padding:12px 14px 90px}
    .acts{display:flex}
    .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:20px;z-index:15;
      width:54px;height:54px;border-radius:50%;background:var(--acc2);color:#fff;
      font-size:27px;line-height:1;box-shadow:0 6px 22px rgba(0,0,0,.5)}
    .veil{align-items:flex-end;padding:0}
    .sheet{max-width:none;border-radius:16px 16px 0 0;max-height:92vh;padding-bottom:26px}
  }
  @media(min-width:981px){ .burger{display:none} .scrim{display:none!important} }
  @media(max-width:1240px) and (min-width:981px){
    .stats{grid-template-columns:1fr 1fr 1fr} .st.goal{grid-column:1/-1}
  }
</style>
</head>
<body>

<div id="gate">
  <h2>工作看板</h2>
  <p>貼上試算表「設定」工作表裡的 TOKEN，這台裝置之後就記住了。</p>
  <input id="tok" type="password" placeholder="TOKEN" autocomplete="off">
  <button onclick="saveTok()">進入</button>
  <div id="err"></div>
</div>

<div id="app">
<div class="scrim" id="scrim" onclick="side(0)"></div>
<div class="shell">
  <aside class="side" id="side">
    <div class="me"><div class="av">P</div><b>Penny</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="pool">
      <h4>AI 專案池 <button onclick="openAdd('task')">＋ 新增</button></h4>
      <div id="pool"></div>
    </div>
    <button class="fold" onclick="side(0,1)">« 收合側邊欄</button>
  </aside>

  <div class="main">
    <div class="top">
      <h1><button class="icon burger" onclick="side(1)">☰</button><i id="hIcon">🎯</i><span id="h1">Penny 每日高產值工作看板</span></h1>
      <div class="tools">
        <div class="srch" id="srchBox"><span style="color:var(--dim)">🔍</span>
          <input id="q" placeholder="搜尋" oninput="paint()"></div>
        <button class="icon" onclick="go('goals')" title="逾期任務">🔔<b id="bell" style="display:none">0</b></button>
        <div class="ava">P</div>
      </div>
    </div>
    <div class="sub">
      <span id="dates" class="d">
        <span class="d">🕐 <span id="dateLab"></span></span>
        <button class="step" onclick="shift(-1)" title="上一個">‹</button>
        <button class="step" onclick="shift(1)" title="下一個">›</button>
        <button class="chip" id="todayChip" onclick="goToday()">今天</button>
      </span>
      <span id="extra"></span>
      <span class="grow"></span>
      <div class="split">
        <button class="btn" onclick="openAdd('task')">＋ 新增任務</button>
        <button class="car" onclick="event.stopPropagation();document.getElementById('menu').classList.toggle('on')">▾</button>
        <div class="menu" id="menu">
          <button onclick="openAdd('task')">新增任務</button>
          <button onclick="openAdd('log')">手動補一筆紀錄</button>
          <button onclick="load(1)">重新整理</button>
          <button onclick="openSheet()">開啟 Google 試算表</button>
        </div>
      </div>
    </div>
    <div id="view"><div class="spin">載入中…</div></div>
  </div>
</div>
<button class="fab" onclick="openAdd('task')">＋</button>
</div>

<div class="veil" id="veil" onclick="if(event.target===this)closeAdd()">
  <div class="sheet">
    <h3 id="shTitle">新增任務</h3>
    <div class="seg">
      <button id="sgT" class="on" onclick="kind('task')">任務</button>
      <button id="sgL" onclick="kind('log')">手動紀錄</button>
    </div>
    <div class="f"><label>標題</label><input id="fT" placeholder="要做什麼 / 做了什麼"></div>
    <div class="f"><label>專案</label><input id="fP" list="pjs" placeholder="例：起士公爵"><datalist id="pjs"></datalist></div>
    <div id="taskF">
      <div class="f"><label>下一步（具體要動手的第一件事）</label><input id="fN" placeholder="例：優化內頁標題"></div>
      <div class="f2">
        <div class="f"><label>到期日</label><input id="fD" type="date"></div>
        <div class="f"><label>優先</label><select id="fPr">
          <option value="A">A 優先處理</option><option value="B" selected>B 推進型</option><option value="C">C 維護型</option>
        </select></div>
      </div>
      <div class="f"><label>等待者（卡在誰身上，沒有就留空）</label><input id="fW" placeholder="例：PN"></div>
    </div>
    <div id="logF" style="display:none">
      <div class="f"><label>摘要</label><textarea id="fS" rows="2"></textarea></div>
      <div class="f"><label>連結</label><input id="fL" placeholder="https://"></div>
    </div>
    <div class="foot">
      <button onclick="closeAdd()">取消</button>
      <button class="pri" id="fSave" onclick="submit()">儲存</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
var SHEET='https://docs.google.com/spreadsheets/d/136z3S0ADQHRda3q8O_B_GFBlBlBuE-oEg0mxIeT0FVc/edit';
var VIEWS=[
  {v:'board',    i:'▦', n:'每日看板',  t:'Penny 每日高產值工作看板', ic:'🎯'},
  {v:'projects', i:'▤', n:'專案總覽',  t:'專案總覽',      ic:'▤'},
  {v:'pool',     i:'✦', n:'AI 專案池', t:'AI 專案池',     ic:'✦'},
  {v:'outputs',  i:'🗄', n:'資料庫',    t:'產出資料庫',    ic:'🗄️'},
  {v:'goals',    i:'◎', n:'目標追蹤',  t:'目標追蹤',      ic:'◎'},
  {v:'settings', i:'⚙', n:'設定',      t:'設定',          ic:'⚙'}
];
var PN={A:'A 優先處理',B:'B 推進型',C:'C 維護型'};
var TOKEN='',VIEW='board',KIND='task',EDIT=null,COL='',DATE=null,PJDATE=null,PJRANGE='week',SRC='',ALL=0,D=null,RAW=null;
try{TOKEN=localStorage.getItem('worklog_token')||''}catch(e){}

var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},1900)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function md(s){var m=String(s).match(/^\d{4}-(\d{2})-(\d{2})/);return m?(+m[1])+'/'+(+m[2]):''}
function parse(s){return new Date(String(s).slice(0,10)+'T00:00:00')}

function call(a,p){return new Promise(function(res,rej){
  google.script.run.withSuccessHandler(function(r){r&&r.ok?res(r):rej(new Error((r&&r.error)||'未知錯誤'))})
    .withFailureHandler(rej).uiCall(TOKEN,a,p||{})})}

function boot(){
  if(!TOKEN){$('gate').style.display='block';return}
  $('gate').style.display='none';$('app').style.display='block';
  $('nav').innerHTML=VIEWS.map(function(x){
    return '<button data-v="'+x.v+'" onclick="go(\''+x.v+'\')"><i>'+x.i+'</i>'+x.n+'</button>'}).join('');
  go('board')}
function saveTok(){var v=$('tok').value.trim();if(!v)return;
  TOKEN=v;$('err').textContent='';
  call('ping').then(function(){try{localStorage.setItem('worklog_token',v)}catch(e){}boot()})
    .catch(function(e){TOKEN='';$('err').textContent=e.message})}
function logout(){try{localStorage.removeItem('worklog_token')}catch(e){}location.reload()}
function side(on,fold){var s=$('side');
  if(fold){s.classList.toggle('hide');return}
  s.classList.toggle('show',!!on);$('scrim').classList.toggle('on',!!on)}
function openSheet(){window.open(SHEET,'_blank','noopener')}

function go(v){
  VIEW=v;$('menu').classList.remove('on');side(0);
  var m=VIEWS.filter(function(x){return x.v===v})[0]||VIEWS[0];
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.v===v)});
  $('h1').textContent=m.t;$('hIcon').textContent=m.ic;
  $('srchBox').classList.toggle('off',v==='settings'||v==='goals');
  $('dates').style.display=(v==='board'||v==='projects')?'':'none';
  $('q').value='';
  load(1)}

function load(force){
  if(force)$('view').innerHTML='<div class="spin">載入中…</div>';
  if(VIEW==='settings'){RAW=null;paint();return}
  var p;
  if(VIEW==='projects')p=call('projects',{range:PJRANGE,date:PJDATE||today()});
  else if(VIEW==='pool')p=call('pool',{});
  else if(VIEW==='outputs')p=call('outputs',{source:SRC,all:ALL?'1':''});
  else if(VIEW==='goals')p=call('goals',{});
  else p=call('board',DATE?{date:DATE}:{});
  p.then(function(r){
    RAW=r;
    if(r.stats)D=r;                                  // 看板資料，卡片動作要用
    if(r.projects&&(r.stats||r.order))renderPool(r.projects);
    paint()})
   .catch(function(e){
     $('view').innerHTML='<div class="spin">錯誤：'+esc(e.message)+'</div>';
     if(/token/.test(e.message))logout()})}

function shift(n){
  if(VIEW==='projects'){
    var d=parse(PJDATE||today());
    if(PJRANGE==='day')d.setDate(d.getDate()+n);
    else if(PJRANGE==='week')d.setDate(d.getDate()+7*n);
    else d.setMonth(d.getMonth()+n);
    PJDATE=ymd(d)}
  else if(VIEW==='board'){var b=parse(DATE||today());b.setDate(b.getDate()+n);DATE=ymd(b)}
  else return;
  load(1)}
function goToday(){DATE=null;PJDATE=null;load(1)}
function pjRange(r){PJRANGE=r;load(1)}

/* ---------------- header bits ---------------- */
var RNAME={day:'日',week:'週',month:'月'};
function header(){
  var lab='',now=true;
  if(VIEW==='projects'&&RAW&&RAW.from){
    lab=PJRANGE==='day'?dayLab(RAW.from):(RAW.from+' – '+RAW.to);
    now=RAW.from<=today()&&today()<=RAW.to}
  else{var d=parse((RAW&&RAW.date)||DATE||today());lab=dayLab(ymd(d));now=ymd(d)===today()}
  $('dateLab').textContent=lab;
  $('todayChip').classList.toggle('on',now);
  $('todayChip').textContent=VIEW==='projects'?{day:'今天',week:'本週',month:'本月'}[PJRANGE]:'今天';

  var ex='';
  if(VIEW==='projects')ex=['day','week','month'].map(function(r){
    return '<button class="chip'+(PJRANGE===r?' on':'')+'" onclick="pjRange(\''+r+'\')">'+RNAME[r]+'</button>'}).join(' ');
  if(VIEW==='outputs'&&RAW)ex=srcChips(RAW);
  if(VIEW==='board'&&RAW&&RAW.note)ex='<span class="chip">早晨簡報已產生</span>';
  $('extra').innerHTML=ex;

  var od=RAW&&(RAW.stats?RAW.stats.overdue:RAW.overdue);
  $('bell').style.display=od?'grid':'none';$('bell').textContent=od||0}

function dayLab(s){var d=parse(s);
  return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日（星期'+'日一二三四五六'[d.getDay()]+'）'}

function hit(o,q){return !q||[o.title,o.project,o.next,o.waiting,o.summary,o.source]
  .some(function(x){return String(x||'').toLowerCase().indexOf(q)>=0})}

function paint(){
  header();
  var q=$('q').value.trim().toLowerCase();
  if(VIEW==='settings')return $('view').innerHTML=settings();
  if(!RAW)return;
  if(VIEW==='board')return $('view').innerHTML=board(RAW,q);
  if(VIEW==='projects')return $('view').innerHTML=projects(RAW,q);
  if(VIEW==='pool')return $('view').innerHTML=pool(RAW,q);
  if(VIEW==='outputs')return $('view').innerHTML=outputs(RAW,q);
  if(VIEW==='goals')return $('view').innerHTML=goals(RAW)}

/* ---------------- board ---------------- */
function board(r,q){
  var f=function(a,c){return a.filter(function(x){return hit(x,q)}).map(function(t){return taskCard(t,c)})};
  var run=f(r.running,'run').concat(r.liveLogs.filter(function(l){return hit(l,q)}).map(logCard));
  return '<div class="cols">'+
    col('c-run','⏰','AI 正執行工作',run,'現在沒有進行中的工作')+
    col('c-today','📅','今日工作',f(r.today,'today'),'今天沒有到期的任務')+
    col('c-tmr','🕐','明日工作',f(r.tomorrow,'tmr').concat(f(r.unscheduled.slice(0,3),'tmr')),'明天空著')+
    '</div>'+stats(r)}

function col(cls,icon,title,cards,empty){
  return '<section class="col '+cls+'" data-drop="'+cls.slice(2)+'"><h3><i>'+icon+'</i>'+title+'<b>'+cards.length+'</b></h3>'+
    (cards.length?cards.join(''):'<div class="none">'+esc(empty)+'</div>')+
    '<button class="add" onclick="openAdd(\'task\',\''+cls.slice(2)+'\')">＋ 新增任務</button></section>'}

/** col 是這張卡目前在哪一欄（run/today/tmr），用來決定動作列要出現哪些「移到」按鈕。
    手機三欄是上下堆疊的，垂直拖曳會跟捲動打架，所以那邊靠這些按鈕，桌機才用拖的。 */
function taskCard(t,col){
  var td=today(),cls=t.due?(t.due<td?'over':(t.due===td?'now':'')):'';
  var lbl=t.due?(t.due<td?'逾期 '+md(t.due):(t.due===td?'今天':(t.due===ymd(new Date(Date.now()+864e5))?'明天':md(t.due)))):'未排日期';
  var a=(t.status!=='進行中'?'<button class="go" onclick="event.stopPropagation();toCol(\''+t.id+'\',\'run\',\''+(col||'')+'\')">開始</button>':'')+
    '<button class="ok" onclick="st(\''+t.id+'\',\'完成\')">完成 ✓</button>'+
    (col!=='today'?'<button onclick="event.stopPropagation();toCol(\''+t.id+'\',\'today\',\''+(col||'')+'\')">移到今日</button>':'')+
    (col!=='tmr'?'<button onclick="event.stopPropagation();toCol(\''+t.id+'\',\'tmr\',\''+(col||'')+'\')">移到明日</button>':'')+
    '<button onclick="edit(\''+t.id+'\')">編輯</button>';
  var sub=(t.project?'<em>'+esc(t.project)+'</em>':'')+
    (t.waiting?'<b>等待者：</b>'+esc(t.waiting):(t.next?'<b>下一步：</b>'+esc(t.next):''));
  return '<article class="t p'+t.priority+'" data-id="'+t.id+'" title="'+PN[t.priority]+'">'+
    '<div class="ti">'+esc(t.title)+'</div>'+
    '<div class="meta"><div class="nx">'+sub+'</div>'+
      '<div class="dd '+cls+'">📅 '+lbl+'</div></div>'+
    '<div class="acts">'+a+'</div></article>'}

function logCard(l){
  return '<article class="t live"><div class="ti">'+esc(l.title)+'</div>'+
    '<div class="tags"><span class="tag src">'+esc(l.source)+' 執行中</span>'+
      (l.project?'<span class="tag pj">'+esc(l.project)+'</span>':'')+'</div>'+
    '<div class="meta"><div class="nx">'+esc(l.summary||'')+'</div>'+
      '<div class="dd">🕐 '+String(l.start).slice(11,16)+' 起</div></div></article>'}

function stats(r){
  var s=r.stats,pct=s.weekTotal?Math.round(s.weekDone*100/s.weekTotal):0,C=2*Math.PI*20;
  var dlt='';
  if(s.focusHoursPrev>0){var p=Math.round((s.focusHours-s.focusHoursPrev)*100/s.focusHoursPrev);
    if(p)dlt='<em class="'+(p<0?'dn':'')+'">'+(p>0?'▲':'▼')+' '+Math.abs(p)+'%</em>'}
  else if(s.focusHours>0)dlt='<em>▲ 新增</em>';
  return '<div class="stats">'+
    '<div class="st goal"><div class="k">🎯 今日專注目標</div><div class="u">'+
      (r.note?esc(r.note.split('\n').filter(function(x){return x.trim()}).slice(-2).join(' '))
        :'尚未產生早晨簡報。先把優先處理的做掉，再談其他。')+'</div></div>'+
    '<div class="st"><div class="k">已完成任務</div><div class="v">'+s.doneToday+'<small>/ '+s.totalToday+'</small></div></div>'+
    '<div class="st"><div class="k">優先任務占比</div><div class="v" style="color:var(--b)">'+s.highValuePct+'%</div>'+
      '<div class="bar"><i style="width:'+s.highValuePct+'%"></i></div></div>'+
    '<div class="st"><div class="k">專注時間</div><div class="v">'+s.focusHours+'<small>小時</small>'+dlt+'</div>'+
      '<div class="u">昨天 '+s.focusHoursPrev+' 小時</div></div>'+
    '<div class="st"><div class="k">本週進度</div>'+
      '<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="#1c202a" stroke-width="4"/>'+
      '<circle cx="23" cy="23" r="20" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"'+
      ' stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct/100)).toFixed(1)+'" transform="rotate(-90 23 23)"/>'+
      '<text x="23" y="27" text-anchor="middle" fill="#8b93a1" font-size="11" font-weight="700">'+pct+'%</text></svg>'+
      '<div class="v">'+s.weekDone+'<small>/ '+s.weekTotal+'</small></div></div>'+
    '</div>'}

/* ---------------- projects / pool ---------------- */
function renderPool(ps){
  $('pool').innerHTML=ps.length?ps.slice(0,10).map(function(p){
    return '<button class="pj p'+p.priority+'" onclick="go(\'projects\')"><div class="n">'+esc(p.name)+
      '<span class="tag '+p.priority+'">'+p.priority+'</span></div>'+
      '<div class="s">'+(p.next?'下一步：'+esc(p.next):p.count+' 件待辦')+'</div>'+
      '<div class="s">'+(p.due?'截止日：'+md(p.due):'未排日期')+(p.overdue?' · 逾期 '+p.overdue:'')+'</div></button>'
  }).join(''):'<div class="none">還沒有任務</div>';
  $('pjs').innerHTML=ps.map(function(p){return '<option value="'+esc(p.name)+'">'}).join('')}

function allTasks(r){
  r=r||{};
  var a=(r.running||[]).concat(r.today||[],r.tomorrow||[],r.unscheduled||[],r.tasks||[]);
  (r.projects||[]).forEach(function(p){if(p.tasks)a=a.concat(p.tasks)});
  (r.order||[]).forEach(function(o){a.push(o.task)});
  return a}
function projects(r,q){
  var f=function(a){return a.filter(function(x){return hit(x,q)})};
  var head='<div class="wrap">'+
    '<div class="panelbox" style="display:flex;gap:26px;flex-wrap:wrap">'+
      kpi('區間',RNAME[r.range]+(r.range==='day'?'':' · '+r.from+' – '+r.to))+
      kpi('任務',r.done+' / '+r.total+' 完成')+
      kpi('實際紀錄',r.logs.length+' 筆 · '+logHours(r.logs)+' 小時')+
      kpi('未排日期',r.unscheduled.length+' 件')+
    '</div>';
  var body=r.range==='month'?monthCal(r,f):timeCal(r,f);
  return head+body+
    '<div class="legend">'+
      '<span><i style="background:#34d399"></i>Claude Code</span>'+
      '<span><i style="background:#e0a03a"></i>Cowork</span>'+
      '<span><i style="background:#4ea3f5"></i>手動</span>'+
      '<span>上方全天列是排定的任務，時間軸是實際跑過的紀錄</span>'+
    '</div>'+
    (r.unscheduled.length?'<div class="sec">未排日期 '+r.unscheduled.length+'</div>'+
      f(r.unscheduled).map(function(t){return taskCard(t,'')}).join(''):'')+
    '</div>'}

function logHours(logs){
  var m=0;logs.forEach(function(l){var a=tmin(l.start),b=tmin(l.end);
    if(a!=null&&b!=null&&b>a)m+=b-a});
  return Math.round(m/6)/10}

/** 'yyyy-MM-dd HH:mm' → 當天的第幾分鐘；沒有時間就回 null */
function tmin(s){var m=String(s||'').match(/ (\d{2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
function days(from,to){var a=[],d=parse(from),e=parse(to);
  while(d<=e){a.push(ymd(d));d.setDate(d.getDate()+1)}return a}
function srcCls(s){return s==='Claude Code'?'cc':(s==='Cowork'?'cw2':'mn')}

/* ---- 日／週：上方全天列放任務，下方時間軸放紀錄 ---- */
function timeCal(r,f){
  var ds=days(r.from,r.to),td=today(),H=44;
  var tasks=f(r.tasks),logs=f(r.logs);

  // 時間軸範圍跟著實際紀錄伸縮，預設 8–19 點
  var lo=8*60,hi=19*60;
  logs.forEach(function(l){var a=tmin(l.start),b=tmin(l.end);
    if(a!=null){lo=Math.min(lo,a);hi=Math.max(hi,b==null?a+60:b)}});
  lo=Math.floor(lo/60)*60;hi=Math.min(24*60,Math.ceil(hi/60)*60);
  if(hi<=lo)hi=lo+60;
  var hrs=(hi-lo)/60;

  var byDay={},tByDay={};
  logs.forEach(function(l){(byDay[String(l.start).slice(0,10)]=byDay[String(l.start).slice(0,10)]||[]).push(l)});
  tasks.forEach(function(t){if(t.due)(tByDay[t.due]=tByDay[t.due]||[]).push(t)});

  var style='--n:'+ds.length+';--gut:52px;--h:'+H+'px';
  var h='<div class="cw" style="'+style+'">'+
    '<div class="crow chead"><div>GMT+8</div>'+ds.map(function(d){
      var x=parse(d);
      return '<div class="'+(d===td?'today':'')+'"><div class="wd">週'+'日一二三四五六'[x.getDay()]+
        '</div><div class="dn">'+x.getDate()+'</div></div>'}).join('')+'</div>'+
    '<div class="crow allday"><div>全天</div>'+ds.map(function(d){
      var ts=tByDay[d]||[];
      return '<div>'+ts.map(function(t){
        return '<button class="chip2 '+t.priority+(t.status==='完成'?' dn2':'')+
          '" onclick="edit(\''+t.id+'\')" title="'+esc(t.title)+'">'+esc(t.title)+'</button>'}).join('')+
        '</div>'}).join('')+'</div>'+
    '<div class="cbody"><div class="crow">'+
      '<div class="gut">'+Array.apply(null,{length:hrs}).map(function(_,i){
        return '<div>'+(lo/60+i)+':00</div>'}).join('')+'</div>'+
      ds.map(function(d){
        var x=parse(d),wknd=x.getDay()===0||x.getDay()===6;
        var slots=Array.apply(null,{length:hrs}).map(function(){return '<div class="hr"></div>'}).join('');
        return '<div class="dcol'+(wknd?' wknd':'')+(d===td?' tdy':'')+'">'+slots+
          lay(byDay[d]||[],lo,hi,H)+(d===td?nowLine(lo,hi,H):'')+'</div>'}).join('')+
    '</div></div></div>';
  return h}

/** 同一天的紀錄鋪到時間軸上；時間重疊的並排，不要互相蓋住 */
function lay(logs,lo,hi,H){
  var evs=logs.map(function(l){
    var a=tmin(l.start),b=tmin(l.end);
    if(a==null)return null;
    if(b==null||b<=a)b=Math.min(a+30,hi);       // 還在跑的畫 30 分鐘
    return {l:l,a:Math.max(a,lo),b:Math.min(b,hi),live:tmin(l.end)==null}
  }).filter(function(e){return e&&e.b>lo&&e.a<hi}).sort(function(p,q){return p.a-q.a});

  var out='',i=0;
  while(i<evs.length){
    var g=[evs[i]],end=evs[i].b,j=i+1;
    while(j<evs.length&&evs[j].a<end){g.push(evs[j]);end=Math.max(end,evs[j].b);j++}
    g.forEach(function(e,k){
      var w=100/g.length,top=(e.a-lo)/60*H,ht=Math.max(18,(e.b-e.a)/60*H-2);
      out+='<div class="ev '+srcCls(e.l.source)+(e.live?' run':'')+'" style="top:'+top.toFixed(1)+
        'px;height:'+ht.toFixed(1)+'px;left:calc('+(w*k)+'% + 2px);width:calc('+w+'% - 4px)" title="'+
        esc(e.l.title)+'"><b>'+esc(e.l.title)+'</b>'+
        (ht>32?'<s>'+String(e.l.start).slice(11,16)+(e.live?' 起 · 執行中':'–'+String(e.l.end).slice(11,16))+
          (e.l.project?' · '+esc(e.l.project):'')+'</s>':'')+'</div>'});
    i=j}
  return out}

function nowLine(lo,hi,H){
  var d=new Date(),m=d.getHours()*60+d.getMinutes();
  if(m<lo||m>hi)return '';
  return '<div class="now" style="top:'+((m-lo)/60*H).toFixed(1)+'px"></div>'}

/* ---- 月：格子裡放任務，附當天紀錄筆數 ---- */
function monthCal(r,f){
  var first=parse(r.from),td=today(),m=first.getMonth();
  var start=new Date(first);start.setDate(1-((first.getDay()+6)%7));   // 補到週一
  var last=parse(r.to),end=new Date(last);end.setDate(last.getDate()+(7-((last.getDay()+6)%7)-1));

  var tByDay={},nByDay={};
  f(r.tasks).forEach(function(t){if(t.due)(tByDay[t.due]=tByDay[t.due]||[]).push(t)});
  f(r.logs).forEach(function(l){var d=String(l.start).slice(0,10);nByDay[d]=(nByDay[d]||0)+1});

  var h='<div class="mgrid">'+['一','二','三','四','五','六','日'].map(function(w){
    return '<div class="mh">週'+w+'</div>'}).join('');
  for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    var k=ymd(d),ts=tByDay[k]||[],n=nByDay[k]||0;
    h+='<div class="mc'+(d.getMonth()!==m?' out':'')+(k===td?' tdy':'')+'">'+
      '<div class="d">'+d.getDate()+'</div>'+
      ts.slice(0,3).map(function(t){
        return '<button class="chip2 '+t.priority+(t.status==='完成'?' dn2':'')+
          '" onclick="edit(\''+t.id+'\')" title="'+esc(t.title)+'">'+esc(t.title)+'</button>'}).join('')+
      (ts.length>3?'<div class="more">還有 '+(ts.length-3)+' 件</div>':'')+
      (n?'<div class="more">● '+n+' 筆紀錄</div>':'')+'</div>'}
  return h+'</div>'}

function kpi(k,v){return '<div><div class="k" style="font-size:12px;color:var(--dim)">'+esc(k)+
  '</div><div style="font-size:17px;font-weight:700;margin-top:3px">'+esc(v)+'</div></div>'}

/* ---------------- AI 專案池 ---------------- */
function pool(r,q){
  var order=r.order.filter(function(o){return hit(o.task,q)});
  var h='<div class="wrap">'+
    '<div class="panelbox" style="display:flex;gap:26px;flex-wrap:wrap">'+
      kpi('未完成',r.backlog+' 件')+
      kpi('逾期',r.overdue+' 件')+
      kpi('專案',r.projects.length+' 個')+
      kpi('昨天',r.yesterday.length+' 筆 · '+r.yesterdayHours+' 小時')+
    '</div>';

  h+='<div class="sec">建議順序</div>';
  h+=order.length?'<div class="panelbox" style="padding:8px 10px">'+order.map(function(o,i){
      var t=o.task;
      return '<div class="rank"><b>'+(i+1)+'</b><div class="grow" style="min-width:0">'+
        '<div class="rt">'+esc(t.title)+'</div>'+
        '<div class="rs">'+esc(o.reason)+(t.project?' · '+esc(t.project):'')+
          (t.next?' · 下一步：'+esc(t.next):'')+'</div></div>'+
        '<span class="tag '+t.priority+'">'+t.priority+'</span>'+
        '<button class="chip" onclick="toCol(\''+t.id+'\',\'run\',\'\')">開始</button></div>'
    }).join('')+'</div>':'<div class="none">沒有待辦</div>';

  h+='<div class="sec">昨天執行的內容</div>';
  h+=r.yesterday.length?r.yesterday.filter(function(l){return hit(l,q)}).map(logRow).join('')
    :'<div class="none">昨天沒有紀錄</div>';

  h+='<div class="sec">各專案還剩什麼</div>';
  r.projects.forEach(function(p){
    var ts=p.tasks.filter(function(t){return hit(t,q)});
    if(!ts.length)return;
    h+='<div class="panelbox"><h3>'+esc(p.name)+' <span class="tag '+p.priority+'">'+p.priority+'</span>'+
      (p.overdue?' <span class="tag A">逾期 '+p.overdue+'</span>':'')+'</h3>'+
      ts.map(function(t){return taskCard(t,'')}).join('')+'</div>'});
  return h+'</div>'}

/* ---------------- 產出資料庫 ---------------- */
function srcChips(r){
  var ks=Object.keys(r.bySource);
  return '<button class="chip'+(SRC?'':' on')+'" onclick="SRC=\'\';load(1)">全部 '+r.linked+'</button> '+
    ks.map(function(k){
      return '<button class="chip'+(SRC===k?' on':'')+'" onclick="SRC=\''+k+'\';load(1)">'+
        esc(k)+' '+r.bySource[k]+'</button>'}).join(' ')+
    ' <button class="chip'+(ALL?' on':'')+'" onclick="ALL=ALL?0:1;load(1)">含無連結</button>'}

function outputs(r,q){
  var rows=r.rows.filter(function(l){return hit(l,q)});
  if(!rows.length)return '<div class="wrap"><div class="none">'+
    (r.all?'沒有符合的紀錄':'還沒有帶產出連結的紀錄。work-log skill 在有產出檔時會把連結一起寫進來。')+'</div></div>';
  var by={},order=[];
  rows.forEach(function(l){var d=String(l.start).slice(0,10);
    if(!by[d]){by[d]=[];order.push(d)}by[d].push(l)});
  return '<div class="wrap">'+order.map(function(d){
    return '<div class="sec">'+d+' · '+by[d].length+' 筆</div>'+by[d].map(outRow).join('')}).join('')+'</div>'}

function outRow(l){
  return '<div class="lg"><div class="ti">'+esc(l.title)+'</div>'+
    '<div class="tags"><span class="tag src">'+esc(l.source)+'</span>'+
    (l.project?'<span class="tag pj">'+esc(l.project)+'</span>':'')+
    '<span class="tag pj">'+String(l.start).slice(11,16)+(l.end?'–'+String(l.end).slice(11,16):' 起')+'</span>'+
    (l.status!=='完成'?'<span class="tag A">'+esc(l.status)+'</span>':'')+'</div>'+
    (l.summary?'<div class="sm">'+esc(l.summary)+'</div>':'')+
    (l.link?'<a class="url" href="'+esc(l.link)+'" target="_blank" rel="noopener">🔗 '+esc(l.link)+'</a>':'')+
    '</div>'}

function logRow(l){
  return '<div class="lg"><div class="ti">'+esc(l.title)+'</div>'+
    '<div class="tags"><span class="tag src">'+esc(l.source)+'</span>'+
    (l.project?'<span class="tag pj">'+esc(l.project)+'</span>':'')+
    '<span class="tag pj">'+String(l.start).slice(11,16)+(l.end?'–'+String(l.end).slice(11,16):' 起')+'</span>'+
    (l.status!=='完成'?'<span class="tag A">'+esc(l.status)+'</span>':'')+'</div>'+
    (l.summary?'<div class="sm">'+esc(l.summary)+'</div>':'')+
    (l.link?'<a class="url" href="'+esc(l.link)+'" target="_blank" rel="noopener">🔗 產出連結</a>':'')+
    '</div>'}

    '<div class="panelbox"><h3>資料來源</h3>'+
      '<div class="kv"><span>Google 試算表</span><b><a href="'+SHEET+'" target="_blank" rel="noopener">開啟</a></b></div>'+

/* ---------------- actions ---------------- */
function st(id,s){event.stopPropagation();
  call('task_update',{id:id,status:s}).then(function(){toast('已更新');load()}).catch(function(e){toast(e.message)})}

/** 把任務移到某一欄。拖曳與動作列按鈕都走這裡。
    run＝開始做；today/tmr＝改到期日，若原本在執行中就一併退回待辦。 */
function toCol(id,to,from){
  if(to===from)return;
  var p={id:id},d=new Date();
  if(to==='run')p.status='進行中';
  else{
    if(to==='tmr')d.setDate(d.getDate()+1);
    p.due=ymd(d);
    if(from==='run')p.status='待辦';
  }
  return call('task_update',p)
    .then(function(){toast('移到「'+DROP[to]+'」');load()})
    .catch(function(e){toast(e.message);load()})}
function bump(id){event.stopPropagation();
  var t=findTask(id),base=t&&t.due?parse(t.due):new Date();base.setDate(base.getDate()+1);
  call('task_update',{id:id,due:ymd(base)}).then(function(){toast('延到 '+md(ymd(base)));load()}).catch(function(e){toast(e.message)})}
function findTask(id){
  var a=allTasks(RAW).concat(allTasks(D));
  for(var i=0;i<a.length;i++)if(a[i]&&a[i].id===id)return a[i];return null}
function edit(id){event.stopPropagation();
  var t=findTask(id);if(!t)return;
  EDIT=id;openAdd('task');$('shTitle').textContent='編輯任務';
  $('fT').value=t.title;$('fP').value=t.project;$('fN').value=t.next;
  $('fD').value=t.due;$('fPr').value=t.priority;$('fW').value=t.waiting}

/** col 決定新任務的預設日期與狀態：今日欄＝今天、明日欄＝明天、
    正執行欄＝今天且直接標進行中。從別的地方叫就預設今天。 */
function openAdd(k,col){
  $('menu').classList.remove('on');$('veil').classList.add('on');kind(k||'task');
  if(!EDIT&&(k||'task')==='task'){
    COL=col||'today';
    var d=new Date();if(COL==='tmr')d.setDate(d.getDate()+1);
    $('fD').value=ymd(d)}
  setTimeout(function(){$('fT').focus()},60)}
function closeAdd(){$('veil').classList.remove('on');EDIT=null;COL='';
  ['fT','fP','fN','fD','fW','fS','fL'].forEach(function(i){$(i).value=''});$('fPr').value='B'}
function kind(k){KIND=k;
  $('sgT').classList.toggle('on',k==='task');$('sgL').classList.toggle('on',k==='log');
  $('taskF').style.display=k==='task'?'':'none';$('logF').style.display=k==='log'?'':'none';
  $('shTitle').textContent=EDIT?'編輯任務':(k==='task'?'新增任務':'手動紀錄')}

function submit(){
  var t=$('fT').value.trim();if(!t){toast('標題必填');return}
  $('fSave').disabled=true;
  var p;
  if(KIND==='task'){
    var d={title:t,project:$('fP').value.trim(),next:$('fN').value.trim(),
      due:$('fD').value,priority:$('fPr').value,waiting:$('fW').value.trim()};
    if(EDIT)d.id=EDIT;
    else if(COL==='run')d.status='進行中';       // 在「AI 正執行」那欄新增＝直接開工
    p=call(EDIT?'task_update':'task_add',d)}
  else p=call('log',{title:t,project:$('fP').value.trim(),summary:$('fS').value.trim(),
      link:$('fL').value.trim(),source:'手動',status:'完成'});
  p.then(function(){toast('已儲存');closeAdd();load()})
   .catch(function(e){toast(e.message)})
   .then(function(){$('fSave').disabled=false})}

/* ---------------- 拖曳換欄 ----------------
   丟到「AI 正執行工作」＝開始做；丟到今日/明日＝改到期日。
   從執行中拖出來會一併退回待辦。滑鼠移動一點就接手，手指則要橫move或長按，
   免得跟捲動打架。紀錄卡（AI session）沒有 data-id，不能拖。            */
var PRESS=null,DRAG=null,NODRAG=0;
var DROP={run:'AI 正執行工作',today:'今日工作',tmr:'明日工作'};

function colOf(el){return el&&el.closest?el.closest('.col[data-drop]'):null}

function press(e){
  if(e.button)return;
  var card=e.target.closest&&e.target.closest('.t[data-id]');
  if(!card||e.target.closest('button')||!colOf(card))return;
  clearPress();
  PRESS={card:card,id:card.dataset.id,x:e.clientX,y:e.clientY,touch:e.pointerType!=='mouse'};
  if(PRESS.touch)PRESS.timer=setTimeout(function(){if(PRESS)lift(e.clientX,e.clientY)},380)}

function clearPress(){if(PRESS&&PRESS.timer)clearTimeout(PRESS.timer);PRESS=null}

function lift(x,y){
  var card=PRESS.card,r=card.getBoundingClientRect();
  var g=card.cloneNode(true);
  g.className='t ghost';g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);
  DRAG={id:PRESS.id,card:card,ghost:g,dx:x-r.left,dy:y-r.top,from:colOf(card).dataset.drop,over:null};
  card.classList.add('lift');document.body.classList.add('dragging');
  clearPress();over(x,y)}

function over(x,y){
  DRAG.ghost.style.left=(x-DRAG.dx)+'px';DRAG.ghost.style.top=(y-DRAG.dy)+'px';
  var c=colOf(document.elementFromPoint(x,y));
  if(c===DRAG.over)return;
  if(DRAG.over)DRAG.over.classList.remove('drop');
  DRAG.over=c;if(c&&c.dataset.drop!==DRAG.from)c.classList.add('drop');else DRAG.over=null}

function move(e){
  if(DRAG){over(e.clientX,e.clientY);return}
  if(!PRESS)return;
  var dx=e.clientX-PRESS.x,dy=e.clientY-PRESS.y;
  if(Math.abs(dx)+Math.abs(dy)<8)return;
  if(!PRESS.touch)return lift(e.clientX,e.clientY);
  if(Math.abs(dx)>Math.abs(dy)*1.4)return lift(e.clientX,e.clientY);
  clearPress()}                       // 手指往上下滑＝想捲動，放手

function drop(){
  clearPress();
  if(!DRAG)return;
  var to=DRAG.over&&DRAG.over.dataset.drop,id=DRAG.id;
  DRAG.ghost.remove();DRAG.card.classList.remove('lift');
  if(DRAG.over)DRAG.over.classList.remove('drop');
  document.body.classList.remove('dragging');
  var from=DRAG.from;DRAG=null;NODRAG=Date.now();
  if(to)toCol(id,to,from)}

document.addEventListener('pointerdown',press);
document.addEventListener('pointermove',move);
document.addEventListener('pointerup',drop);
document.addEventListener('pointercancel',drop);
// 拖曳中要擋掉捲動；平常不擋，所以這個監聽器不能是 passive
document.addEventListener('touchmove',function(e){if(DRAG)e.preventDefault()},{passive:false});

// 卡片點一下展開動作列；剛拖完那一下不算
$('view').addEventListener('click',function(e){
  if(Date.now()-NODRAG<250)return;
  var card=e.target.closest&&e.target.closest('.t[data-id]');
  if(card&&!e.target.closest('button'))card.classList.toggle('open')});

document.addEventListener('click',function(){$('menu').classList.remove('on')});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeAdd();$('menu').classList.remove('on')}
  if(/input|textarea|select/i.test(e.target.tagName))return;
  if(e.key==='n'){e.preventDefault();openAdd('task')}
  if(e.key==='/'){e.preventDefault();$('q').focus()}});

boot();
</script>
