<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent}
  .wrap{width:1024px;height:1024px;display:grid;place-items:center}
  /* macOS 的圖示習慣留邊，直接鋪滿在 Dock 裡會比旁邊的 app 大一號 */
  .sq{width:840px;height:840px;border-radius:188px;position:relative;
      background:linear-gradient(168deg,#3a3a3d 0%,#161617 42%,#0a0a0b 100%);
      box-shadow:
        inset 0 4px 0 rgba(255,255,255,.30),      /* 上緣打光：光從上面來 */
        inset 0 -3px 0 rgba(255,255,255,.05),
        inset 0 0 0 3px rgba(255,255,255,.05),
        0 30px 60px rgba(0,0,0,.55);
      display:grid;place-items:center}
  /* 白面往內凹一階：外框是機身，白面是嵌進去的那一塊 */
  .face{width:560px;height:560px;border-radius:112px;
      background:linear-gradient(170deg,#ffffff 0%,#f2f1ee 55%,#e4e2dd 100%);
      box-shadow:
        0 -6px 14px rgba(0,0,0,.55),
        0 10px 22px rgba(0,0,0,.45),
        inset 0 5px 0 rgba(255,255,255,.9),
        inset 0 -6px 12px rgba(0,0,0,.10);
      display:grid;place-items:center}
  .pw{font:700 232px/1 "Liberation Sans","Helvetica Neue",Arial,sans-serif;
      letter-spacing:-6px;color:#141416;
      text-shadow:0 3px 0 rgba(255,255,255,.55), 0 -2px 3px rgba(0,0,0,.25);
      transform:translateY(-4px)}
</style>
<div class="wrap"><div class="sq"><div class="face"><div class="pw">PW</div></div></div></div>
